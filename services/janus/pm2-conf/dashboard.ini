; janus-dashboard 프로세스 선언
; 스키마: ../../../docs/pm2-conf.md
; 계획:   ../docs/plan.md
;
; 같은 디렉토리의 app.ini 는 Janus 자체이고 껍데기입니다 (systemd 가 띄움).
; 이쪽은 진짜 프로세스입니다.
;
; 띄우기 전에 빌드가 필요합니다 (프런트 정적 파일과 janus.js).
;
;     ./setup-dashboard.sh --build
;     cd pm2 && pm2 start ecosystem.config.js --only janus-dashboard && pm2 save
;
; 빌드가 없으면 프로세스는 뜨지만 대시보드 경로가 503 을 냅니다. /health 는
; 정상이며 details.dashboardBuilt 가 false 로 알려 줍니다.
;
; kamailio-dashboard 와 달리 특별한 그룹 권한이 필요 없습니다. Janus 상태는
; 유닉스 소켓이 아니라 루프백 HTTP(Admin API, 127.0.0.1:7088)로 읽습니다.
; 대신 Admin API 비밀번호를 읽어야 하므로, ../secrets/admin-secret 을 읽을 수
; 있는 사용자로 떠야 합니다 (install.sh 가 그 파일을 600 으로 만듭니다).

[app]
name    = janus-dashboard
cwd     = server
script  = src/index.js

[env]
NODE_ENV = production
PORT     = 28087
