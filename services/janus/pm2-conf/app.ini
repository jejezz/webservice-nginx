; Janus 프로세스 선언 — 껍데기입니다.
; 스키마: ../../../docs/pm2-conf.md
; 계획:   ../docs/plan.md
;
; **Janus 는 pm2 가 관리하지 않습니다.** systemd 유닛(janus.service)이 띄웁니다.
; 그 유닛은 배포판이 아니라 이 저장소가 소유하며, 계획서 2단계에서
; ../janus.service 를 install.sh 가 설치합니다.
;
;   sudo systemctl status janus
;   sudo systemctl restart janus
;   journalctl -u janus -n 40
;
; 미디어(RTP/ICE)는 UDP 포트를 따로 쓰고 pm2 와도 nginx 와도 무관합니다.
; 범위는 janus.jcfg / janus.plugin.sip.jcfg 가 정합니다 (계획서 ⑦ 절).
;
; 그런데도 이 파일을 두는 이유는 규약 때문입니다. services/*/pm2-conf/ 는 이
; 프로젝트에서 "이 서비스는 어떻게 뜨는가"를 적는 자리이고, 여기에 아무것도
; 없으면 나중에 보는 사람이 "선언을 빠뜨린 것"과 "pm2 대상이 아닌 것"을
; 구별할 수 없습니다. enabled = false 로 두어 그 구별을 남깁니다.
;
; enabled = false 면 스캐너가 apps 배열에서 빼므로 pm2 는 이 항목을 모릅니다.
; 다만 script 는 enabled 와 무관하게 필수라(ecosystem.config.js 105행), 값이
; 있어야 합니다. 그래서 실행되면 이유를 설명하고 실패하는 스크립트를 가리켜
; 둡니다.

[app]
name    = janus
enabled = false
script  = pm2-conf/not-managed-by-pm2.sh

; nginx-conf/service.ini 와 짝을 맞추기 위한 값입니다.
; PORT 와 [service] ports 가 어긋나면 스캐너가 교차 검사에서 경고합니다
; (node pm2/ecosystem.config.js --check).
;
; ⚠️ 이 값은 헬스 URL 에 쓰이지 않습니다. enabled = false 인 앱은 스캐너가
;    apps 에서 빼고, manager 는 apps 만 읽기 때문입니다. Janus 의 헬스는
;    nginx-conf/service.ini 의 host + ports + health_path 로 정해집니다.
[env]
PORT = 8088
