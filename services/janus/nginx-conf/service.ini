; Janus WebRTC ↔ SIP 게이트웨이 리버스 프록시 선언
; 스키마: ../../../docs/nginx-conf.md
; 계획:   ../docs/plan.md
;
; 같은 디렉토리의 dashboard.ini 는 관찰용 웹을 선언합니다.
; 한 디렉토리가 서비스 둘을 담는 것은 규약이 허용합니다 — nginx-conf.md 참고.
;
;   service.ini    janus            시그널링 API   8088  (systemd)
;   dashboard.ini  janus-dashboard  관찰 웹        28087 (pm2)
;
; Janus 는 pm2 가 아니라 systemd 가 띄웁니다 (pm2-conf/app.ini 참고).
; 그래도 라우팅 선언은 다른 서비스와 같은 자리에 둡니다 — manager 대시보드가
; services/*/nginx-conf/ 를 훑어 서비스 목록을 만들기 때문입니다.
;
; --- 켜는 순서 (계획서 3-3) ---
;
; ⚠️ **Janus 가 뜬 뒤에 반영하세요.**
;
;     cd services/janus && sudo ./install.sh --apply    # 2단계. Janus 기동
;     ./install.sh                                      # /janus-api/info → 200 확인
;     ./nginx/install_nginx_stack.sh --check            # 선언 검사 (sudo 불필요)
;     sudo ./nginx/install_nginx_stack.sh --skip-install # 반영
;
; 순서를 뒤집으면 nginx 는 라우트를 만들었는데 백엔드가 없어 그 경로가 502 이고,
; manager 대시보드에도 이 서비스가 중단으로 뜹니다.

[service]
name    = janus
enabled = true

host = 127.0.0.1
; Janus 의 HTTP 트랜스포트 포트. TLS 는 nginx 가 끊습니다.
; WebSocket 트랜스포트(8188)는 쓰지 않습니다 — 아래 health_path 주석 참고.
ports = 8088

protocol = http

; Janus 는 /health 를 내지 않습니다. 대신 HTTP 트랜스포트가 항상 내는
; <base_path>/info 를 그대로 헬스로 씁니다. 200 + JSON 이고 status 필드가
; 없으므로, manager 는 이를 정상으로 판정합니다
; (services/manager/server/src/services/health.js — reported === undefined).
;
; base_path 는 janus.transport.http.jcfg 에서 /janus-api 로 바꿉니다. 배포본
; 기본값 /janus 를 그대로 두면 아래 dashboard.ini 의 /janus/ 와 겹칩니다.
;
; ⚠️ 이것이 트랜스포트를 WebSocket 이 아니라 HTTP 로 고른 이유입니다.
;    헬스 URL 은 host + ports[0] + health_path 로 만들어지는데, 서비스 하나에
;    포트는 하나뿐입니다. 라우트를 WS 포트로 보내면 헬스도 그 포트로 가고,
;    Janus 의 WS 트랜스포트는 평범한 HTTP GET 에 응답하지 않아 대시보드에
;    영원히 중단으로 뜹니다. 자세한 검토는 ../docs/plan.md 의 ① 절.
health_path = /janus-api/info

; Janus 시그널링 API (REST + long-poll). janus.js 가 여기에 붙습니다.
;
; ⚠️ **끝에 슬래시를 붙이지 마세요.**
;
; location 을 /janus-api/ 로 두면 nginx 가 슬래시 없는 /janus-api 요청에
; 301 (Location: /janus-api/) 을 냅니다. 그런데 janus.js 는 세션을 만들 때
; 바로 그 주소로 POST 하고(세션 생성 후에야 server + "/" + sessionId 이 됩니다),
; POST 는 301 을 따라가며 본문을 잃습니다. 통화는커녕 연결도 되지 않습니다.
;
;     POST /janus-api   → 301                      ❌ 세션 생성이 여기서 죽는다
;     POST /janus-api/  → {"janus":"success", …}   ✅
;
; 슬래시를 빼면 /janus-api 와 /janus-api/<세션>/<핸들> 이 모두 이 하나에
; 걸립니다. /manager 와 /stock-analyzer 도 같은 이유로 슬래시가 없습니다.
; 실제로 겪고 고쳤습니다.
;
; buffering = off 인 이유: 이벤트를 long-poll 로 받습니다. nginx 가 응답을
; 버퍼링하면 이벤트가 제때 내려가지 않아 통화 성립이 늦어지거나 멈춥니다.
;
; timeout 은 Janus 의 long-poll 대기 시간(기본 30초)보다 넉넉해야 합니다.
; 짧으면 nginx 가 먼저 끊어 클라이언트가 계속 재연결합니다.
;
; proxy_path 를 비워 원본 URI 를 그대로 넘깁니다 — 이 프로젝트의 기본입니다.
; 그래서 Janus 쪽 base_path 가 이 location 과 같아야 합니다.
[route:api]
location  = /janus-api
buffering = off
timeout   = 120
