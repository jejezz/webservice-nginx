; Janus 관찰용 대시보드 (Node 서비스) 리버스 프록시 선언
; 스키마: ../../../docs/nginx-conf.md
; 계획:   ../docs/plan.md
;
; 같은 디렉토리의 service.ini 는 Janus 자체(시그널링 API)를 선언합니다.
;
; 이 서비스는 Janus 를 읽기만 합니다. 재시작하거나 설정을 바꾸지 않습니다 —
; 그건 ../install.sh 가 sudo 로 하는 일입니다. kamailio-dashboard 와 같은 자세입니다.
;
; 브라우저 시험 클라이언트(janus.js)도 이 서비스가 정적 파일로 내려 줍니다.
; nginx 라우트는 프록시만 만들 수 있어(정적 root 를 선언할 수단이 없습니다)
; 어차피 프로세스가 필요하고, 그 김에 /health 와 SSO 검증도 여기서 합니다.
;
; --- 켜는 순서 (계획서 3-3) ---
;
; 이 서비스는 Janus 와 달리 혼자서도 뜹니다 — Janus 가 죽어 있어도 "닿지
; 않습니다" 를 보여주는 것이 이 대시보드의 일입니다. 다만 프로세스가 pm2 에
; 올라와 있어야 502 가 아닙니다.
;
;     ./setup-dashboard.sh --build                       # 의존성 · janus.js · 빌드
;     cd pm2 && pm2 start ecosystem.config.js --only janus-dashboard && pm2 save
;     sudo ./nginx/install_nginx_stack.sh --skip-install  # 반영

[service]
name    = janus-dashboard
enabled = true

host  = 127.0.0.1
ports = 28087

protocol    = http
health_path = /health

; location 기준 **상대 경로**입니다. manager 가 location + 이 값으로 링크를
; 만듭니다 (services/manager/server/src/services/registry.js 의 dashboardUrl).
; 절대 경로(/janus/dashboard)를 적으면 /janus/janus/dashboard 가 됩니다.
dashboard_path = /dashboard

; /janus/  → 관찰 웹,  /janus/dashboard → 대시보드 화면
;
; 옆의 service.ini 가 선언하는 /janus-api/ 와 겹치지 않습니다. nginx 의 접두사
; 매칭은 문자열 그대로이고, "/janus-api/..." 는 "/janus/" 로 시작하지 않기
; 때문입니다 (/janus 다음이 / 가 아니라 - 입니다).
[route:main]
location = /janus/
