; coturn-dashboard 프로세스 선언
; 스키마: ../../../docs/pm2-conf.md
; 계획:   ../docs/plan.md
;
; 같은 디렉토리의 app.ini 는 coturn 자체이고 껍데기입니다 (systemd 가 띄움).
; 이쪽은 진짜 프로세스입니다.
;
; kamailio-dashboard 와 달리 특별한 그룹 권한이 필요 없습니다. coturn 상태는
; systemctl is-active 와 journalctl 로만 읽습니다(coturn CLI 는 v1 에서
; 끕니다 — turnserver.conf 의 no-cli 주석 참고) — 유닉스 소켓도 FIFO 도
; 필요 없어 그룹을 맞출 일이 없습니다.
;
; 다만 static-auth-secret 파일(../secrets/static-auth-secret)을 읽어야 하므로,
; install.sh --apply 가 그 파일을 SUDO_USER 소유로 남깁니다 — Janus 의
; admin-secret 과 같은 처리입니다.

[app]
name    = coturn-dashboard
cwd     = server
script  = src/index.js

[env]
NODE_ENV = production
PORT     = 28090
