; coturn 프로세스 선언 — 껍데기입니다.
; 스키마: ../../../docs/pm2-conf.md
; 계획:   ../docs/plan.md
;
; **coturn 은 pm2 가 관리하지 않습니다.** apt 패키지(coturn)가 설치하는
; systemd 유닛(coturn.service)이 띄웁니다. Kamailio 와 정확히 같은 자리입니다 —
; 배포판이 이미 패키징한 데몬이라, 우리가 유닛을 소유할 이유가 없습니다
; (services/janus 와는 다릅니다 — Janus 는 소스 빌드라 유닛도 우리가 만듭니다).
;
;   sudo systemctl status coturn
;   sudo systemctl restart coturn
;   journalctl -u coturn -n 40
;
; 릴레이 미디어는 UDP 포트를 따로 쓰고 pm2 와도 nginx 와도 무관합니다.
; 범위는 turnserver.conf 가 정합니다 (settings-schema.json 의 relay_port_range).
;
; 그런데도 이 파일을 두는 이유는 규약 때문입니다. services/*/pm2-conf/ 는 이
; 프로젝트에서 "이 서비스는 어떻게 뜨는가"를 적는 자리이고, 여기에 아무것도
; 없으면 나중에 보는 사람이 "선언을 빠뜨린 것"과 "pm2 대상이 아닌 것"을
; 구별할 수 없습니다. enabled = false 로 두어 그 구별을 남깁니다.
;
; enabled = false 면 스캐너가 apps 배열에서 빼므로 pm2 는 이 항목을 모릅니다.
; 다만 script 는 enabled 와 무관하게 필수라(ecosystem.config.js 105행), 값이
; 있어야 합니다. 그래서 실행되면 이유를 설명하고 실패하는 스크립트를 가리켜
; 둡니다.

[app]
name    = coturn
enabled = false
script  = pm2-conf/not-managed-by-pm2.sh

; nginx-conf/service.ini 와 짝을 맞추기 위한 값입니다. coturn 은 HTTP 가
; 아니라 STUN/TURN(UDP/TCP)을 말하므로 헬스에는 쓰이지 않습니다 — 그
; nginx-conf/service.ini 도 enabled = false 입니다(프록시할 것이 없어서).
; 교차 검사(node pm2/ecosystem.config.js --check)가 값 자체는 짝이 맞는지
; 봅니다.
[env]
PORT = 3478
