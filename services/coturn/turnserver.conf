# OWNED-BY-WEBSERVICES — services/coturn/install.sh 가 설치했습니다. 손으로 고치지 마세요.
#
# coturn(TURN/STUN) 서버 설정.
#
# ⚠️ 주석은 반드시 '#' 입니다. rtpengine 과 같은 함정입니다 — 이 저장소의 다른
#    .ini 처럼 ';' 를 쓰면 coturn 이 이 줄을 "키=값도 절도 주석도 아닌 줄"로
#    보고 기동에서 죽습니다 (services/kamailio/rtpengine.conf 의 머리말 참고).
#
# /etc/turnserver.conf 로 설치합니다. 이 파일은 그 원본입니다 — install.sh 가
# 자리표시자(__…__)를 이 장비의 값으로 채워 설치합니다.
#
# ── 이 파일이 고치는 문제 ────────────────────────────────────────────────
#
# 지금 이 저장소의 유일한 NAT 통과 수단은 Janus 의 정적 1:1 매핑
# (janus.jcfg 의 nat_1_1_mapping — 사설 주소를 janus.jcfg 의 public_ip 로
# 그대로 바꿔 SDP·ICE 후보에 싣는 것)뿐입니다. STUN 도 TURN 도 이 스택 어디에도
# 없었습니다 (grep -r turn_server 전체 0건, 2026-09-04 확인).
#
# 그 방식은 LAN·같은 단지 WiFi 단말에는 문제가 없습니다 — 서버와 같은
# 10.0.0.0/8 사설망이라 NAT 통과 자체가 필요 없기 때문입니다. 문제는 셀룰러
# 데이터의 모바일입니다. 통신사 CGNAT(carrier-grade NAT)은 흔히 symmetric·
# restrictive 라서, 정적 매핑이 서버 쪽 주소를 아무리 정확히 알려줘도 단말이
# 그 주소로 매핑되는 포트를 예측할 수 없습니다. 실제로 그렇게 실패한 세션을
# `journalctl -u janus` 로 들여다보면, 단말이 스스로 STUN 으로 알아낸 srflx
# 후보(자기 공인 IP+포트)가 **이미 정확했는데도** ICE 협상이 끝내 성립하지
# 않았습니다 — "클라이언트가 자기 공인 IP 를 모른다" 류의 문제가 아니라,
# 그 주소·포트로 되돌아오는 경로 자체가 통신사 NAT 에서 막히는 것입니다.
# 이런 경우를 뚫는 유일한 방법이 TURN 릴레이입니다 — 릴레이 자체가 공인
# 주소를 가지므로 양쪽 다 그 주소로만 통신하면 됩니다.
#
# 자세한 진단 경위와 다음 단계(Janus·모바일 앱에 TURN 을 실제로 물리는 일)는
# docs/plan.md 를 보세요. 이 서비스 자체는 TURN 서버를 세우는 것까지만입니다.

# ── 수신 ────────────────────────────────────────────────────────────────
#
# STUN/TURN 요청을 받는 포트. 표준값 3478 을 씁니다. TLS(5349)는 v1 범위 밖입니다
# — coturn 용 인증서를 새로 준비해야 하고, 이미 미디어는 DTLS-SRTP(Janus)로
# 암호화되므로 TURN 제어 채널의 TLS 는 급하지 않다고 판단했습니다. 필요해지면
# tls-listening-port 와 인증서 경로를 추가하면 됩니다 (docs/plan.md 의 "아직 안 한 일").
listening-port=__LISTENING_PORT__

# 어떤 인터페이스로 받을지 명시하지 않습니다. 이 장비는 NIC 이 하나뿐입니다
# (`ip -4 addr show` 로 확인 — enp131s0 에 10.10.0.224 하나). listening-ip 를
# 비워 두면 coturn 이 있는 인터페이스를 전부 듣습니다. NIC 이 여럿인 장비로
# 옮기게 되면 그때 이 값을 명시하세요 (janus.jcfg 의 lan_iface 감지처럼 자동
# 감지를 넣는 것은 이 서비스의 범위를 넘어선다고 판단해 v1 에서는 하지 않습니다).

# ── 공인 IP — nat_1_1_mapping 과 같은 문제, 같은 해법 ────────────────────
#
# 이 장비는 공인 IP 를 직접 갖지 않습니다 — 공유기가 1:1 NAT + 포트 포워딩을
# 합니다 (services/janus 와 같은 배치). coturn 에는 그 사정을 external-ip 로
# 알려 줍니다. 형식은 "공인IP/사설IP" 입니다 — 왼쪽을 릴레이 후보 주소로
# 광고하고, 실제 패킷은 오른쪽(이 장비의 사설 주소)으로 주고받습니다.
#
# ⚠️ 공인 IP 가 비어 있으면(LAN 전용 테스트) install.sh 가 이 줄 전체를
#    지웁니다. 자리표시자를 그대로 두면 coturn 이 그 문자열을 주소로 알아듣고
#    기동에 실패하거나(운이 좋으면) 엉뚱한 "공인 IP" 를 광고합니다 — Janus
#    쪽에서 이미 겪은 실수를 여기서 반복하지 않습니다 (install.sh 의
#    __PUBLIC_IP__ 치환 참고).
#
# 공인 IP 가 바뀌는 회선이면(가정용 회선 흔함) 이 값도 Janus 의 public_ip 와
# 함께 갱신해야 합니다. install.sh 는 기본적으로 Janus 의 settings.ini 값을
# 그대로 물려받으므로(같은 회선·같은 공유기이기 때문 — README 참고), 보통은
# Janus 쪽만 갱신해도 따라옵니다.
external-ip=__PUBLIC_IP__

# ── 인증 — 공유 장기 자격 증명 대신 TURN REST API(시간 제한 자격 증명) ──────
#
# coturn 인증에는 두 갈래가 있습니다.
#
#   lt-cred-mech    장기 자격 증명. 계정마다 고정된 사용자명·비밀번호를
#                   coturn 이 알고 있어야 합니다 (kamailio 의 subscriber 테이블과
#                   비슷한 모양).
#   use-auth-secret TURN REST API(RFC 초안, webrtc.org 관행). 자격 증명을 미리
#                   등록하지 않습니다 — 사용자명은 "만료시각:임의값", 비밀번호는
#                   HMAC-SHA1(그 사용자명, 이 static-auth-secret) 로 그 자리에서
#                   계산합니다. coturn 은 만료시각과 서명만 검증하면 되므로
#                   서버 쪽에 계정 저장소가 필요 없습니다.
#
# 이 배치는 Janus 의 SIP 플러그인 뒤에 있는 **모든 모바일 단말**이 같은
# TURN 서버를 씁니다. lt-cred-mech 로 하려면 그 많은 단말에 **같은 계정 하나**를
# 심거나(유출되면 전체를 새로 발급해야 함 — Janus 의 api_secret 이 겪은 것과
# 같은 문제, services/janus/README.md 의 "단말 토큰" 절 참고), 아니면 단말마다
# 계정을 발급·회수하는 저장소를 새로 만들어야 합니다. TURN REST API 는 그
# 저장소 자체가 필요 없고, 자격 증명이 짧은 시간(보통 통화 하나 분량)만
# 유효해 유출 위험도 훨씬 작습니다. 그래서 이쪽을 고릅니다.
#
# static-auth-secret 은 settings-schema.json 의 필드가 아니라 install.sh 가
# secrets/static-auth-secret 에 자동 생성합니다 — Janus 의 admin-secret·
# api-secret 과 같은 자리입니다(services/janus/install.sh 의 ensure_secret).
# 비밀은 사람이 폼에 입력하는 값이 아니라 기계가 생성하는 값이라는 것이
# 이 저장소의 관례이고(설정값은 settings.ini, 비밀은 secrets/), 그 관례를
# 그대로 따릅니다.
#
# ⚠️ **이 비밀로 자격 증명을 실제로 만드는 코드는 아직 없습니다.** Janus 의
#    turn_server/turn_rest_api 설정과, 모바일 앱이 그 만료시각:임의값·HMAC
#    비밀번호를 계산해 iceServers 에 넣는 부분이 모두 이 저장소 밖의 다음
#    단계입니다 — docs/plan.md 의 "아직 안 한 일" 참고.
use-auth-secret
static-auth-secret=__STATIC_AUTH_SECRET__
realm=__REALM__

# ── 릴레이 포트 범위 ────────────────────────────────────────────────────
#
# 이 장비에서 UDP 포트를 바인딩하는 다른 프로세스들과 겹치면 안 됩니다.
#
#   브라우저/모바일 ──WebRTC──▶ Janus ──평문 RTP──▶ rtpengine/rtpproxy ──▶ 인터폰
#                       20000-20200 │  30000-30200         10200-19999
#                       janus.jcfg  └ janus.plugin.sip.jcfg  kamailio/rtpengine.conf
#
#                       모바일(셀룰러) ──TURN 릴레이──▶ 여기 (49160-49560)
#
# 위 셋과 겹치지 않는 대역 중, IANA 의 동적/사설 포트 구간(49152-65535) 안에서
# 넉넉히 400개(49160-49560)를 잡았습니다. coturn 은 통화 하나(음성+영상)당
# 보통 릴레이 후보 1~2개를 할당하므로, 400개면 이 단지 규모에서 동시에 TURN 을
# 실제로 타는 셀룰러 통화가 수백 건 겹쳐도 남습니다. install.sh 가 이 세
# 범위와 실제로 겹치지 않는지 다시 확인합니다 — 여기 적힌 숫자는 참고용이고
# 진실은 각 서비스의 settings.ini/jcfg 입니다.
#
# 공유기에서 이 범위를 UDP 로 포워딩해야 셀룰러 모바일이 실제로 릴레이에
# 닿습니다 — install.sh --apply 끝의 안내를 보세요.
min-port=__RELAY_PORT_RANGE_MIN__
max-port=__RELAY_PORT_RANGE_MAX__

# ── 릴레이 대상 제한 — 여기서는 사설 대역을 막지 않습니다 ─────────────────
#
# ⚠️ 공개 TURN 서비스(인터넷 전체를 상대하는 것)라면 릴레이가 사설 대역
#    (RFC1918)·루프백으로 트래픽을 보내지 못하게 막는 것이 정석입니다 —
#    안 그러면 TURN 이 내부망으로 들어가는 SSRF 통로가 됩니다.
#
#    **이 배치는 그 전제가 다릅니다.** 릴레이가 최종적으로 패킷을 보낼
#    곳이 바로 Janus 입니다(10.10.0.224, 이 coturn 과 같은 사설망). 사설
#    대역을 막으면 TURN 릴레이가 정작 Janus 에 닿지 못해 이 서비스를 만든
#    이유 자체가 사라집니다. 그래서 denied-peer-ip 를 사설 대역에 걸지
#    않습니다 — 이 서버는 "인터넷 전체를 위한 공개 릴레이"가 아니라
#    "이 단지의 모바일이 이 단지의 Janus 로 가는 전용 릴레이"이기 때문입니다.
#
# 루프백(127.0.0.0/8)으로 릴레이하는 것만은 막아 둡니다 — 이건 어떤
# 시나리오에서도 정당한 릴레이 대상이 아닙니다.
no-loopback-peers

# ── 그 밖의 방어 ────────────────────────────────────────────────────────
#
# ICE/SDP 는 멀티캐스트 피어를 요구하지 않습니다. 막아 둡니다.
no-multicast-peers

# coturn 은 telnet 기반 CLI(기본 5766)를 갖고 있고, 거기서 세션 목록·강제
# 종료까지 됩니다. 이 배치는 v1 이라 대시보드가 CLI 를 쓰지 않기로
# 했습니다(server/src/coturn.js 의 주석 참고) — 그러면 이 문을 열어 둘
# 이유가 없습니다. systemctl is-active 와 journalctl 만으로 "떠 있는가·
# 무엇이 로그에 남았는가"는 충분히 봅니다. 세션·할당 개수까지 화면에
# 올리려면 이 줄을 지우고 cli-password 를 잠근 뒤 CLI 클라이언트를 붙이면
# 됩니다.
no-cli

# TURN 메시지에 FINGERPRINT 속성을 강제합니다. STUN/TURN 표준 권장값이고,
# 일부 클라이언트 라이브러리(브라우저 WebRTC 스택 포함)가 이것을 기대합니다.
fingerprint

# 이 장비는 systemd 가 coturn 을 띄웁니다(apt 패키지의 coturn.service —
# Janus 처럼 우리가 유닛을 소유하지 않습니다, README 참고). syslog 나
# log-file 을 지정하지 않으면 coturn 은 표준출력/표준오류로 남기고,
# systemd 가 그것을 저널로 받습니다. 그래서 대시보드의 로그 화면은
# `journalctl -u coturn` 을 그대로 읽습니다(services/janus 의 대시보드가
# janus 저널을 읽는 것과 같은 방식) — 별도의 로그 파일 경로를 관리할
# 필요가 없습니다.
