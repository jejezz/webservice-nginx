; coturn(TURN/STUN) 리버스 프록시 선언
; 스키마: ../../../docs/nginx-conf.md
; 계획:   ../docs/plan.md
;
; 같은 디렉토리의 dashboard.ini 는 관찰용 웹을 선언합니다.
; 한 디렉토리가 서비스 둘을 담는 것은 규약이 허용합니다 — nginx-conf.md 참고.
;
;   service.ini    coturn            STUN/TURN     3478 (UDP/TCP, systemd)
;   dashboard.ini  coturn-dashboard  관찰 웹        28092 (pm2)
;
; --- 지금은 꺼 두었습니다 — kamailio 의 service.ini 와는 다른 이유입니다 ---
;
; ⛔ 꺼 두었습니다 (2026-09-04) — **프록시할 것이 근본적으로 없습니다.**
;
; kamailio 의 service.ini 가 꺼져 있는 이유는 "쓸 클라이언트가 없어서"입니다
; (그 파일을 다시 켤 일이 언젠가 있을 수 있습니다). 이쪽은 다릅니다 — coturn
; 이 말하는 프로토콜(STUN/TURN, RFC 5389/5766)은 HTTP 가 아니라 UDP/TCP 로
; 직접 여는 것이고, nginx 의 reverse_proxy(HTTP/WebSocket 업스트림)로 앞에
; 세울 수 있는 것이 아닙니다. 즉 **enabled = true 가 될 날이 오지 않습니다.**
;
; 그런데도 이 파일을 지우지 않고 남겨 두는 이유는 janus·kamailio 와 같습니다
; — services/*/nginx-conf/ 를 훑는 manager 대시보드가 "이 서비스가 어떤
; 포트를 쓰는가" 를 여기서 읽어 서비스 카드에 보여주기 때문입니다(포트
; 정보는 route 가 아니라 [service] 섹션에 있습니다). enabled = false 라
; 라우트는 만들어지지 않지만, name·ports 선언 자체는 목록에 남습니다.
;
; 클라이언트(모바일 앱)는 이 포트로 **직접** 붙습니다 — TURN 은 원래
; 클라이언트가 서버 주소를 직접 알아야 하는 프로토콜이라, HTTPS 라우팅을
; 거칠 이유가 없습니다. 공유기가 이 포트를 그대로 포워딩합니다
; (install.sh --apply 끝의 안내 참고).

[service]
name    = coturn
enabled = false

host  = 127.0.0.1
; STUN/TURN 수신 포트. settings-schema.json 의 listening_port (기본 3478).
; 실제로는 UDP 와 TCP 모두 이 포트를 쓰지만, 이 섹션은 nginx 업스트림
; 선언용이라 프로토콜 구분이 의미 없습니다 — enabled = false 라 어차피
; 업스트림이 만들어지지 않습니다.
ports = 3478

protocol = http

; coturn 은 HTTP 서비스가 아니라 /health 를 낼 수 없습니다. 위와 같은 이유로
; 이 값은 쓰이지 않습니다 — enabled = false 인 동안에는 라우트도, 헬스
; 호출도 만들어지지 않습니다.
health_path = /health
