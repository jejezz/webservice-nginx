; coturn 관찰용 대시보드 (Node 서비스) 리버스 프록시 선언
; 스키마: ../../../docs/nginx-conf.md
; 계획:   ../docs/plan.md
;
; 같은 디렉토리의 service.ini 는 coturn 자체(STUN/TURN)를 선언합니다 —
; enabled = false 입니다 (프록시할 HTTP 가 없습니다).
;
; 이 서비스는 coturn 을 읽기만 합니다. 재시작하거나 설정을 바꾸지 않습니다 —
; 그건 ../install.sh 가 sudo 로 하는 일입니다. janus-dashboard·
; kamailio-dashboard 와 같은 자세입니다.
;
; --- 켜는 순서 ---
;
; janus·kamailio 와 같은 자리에 setup-dashboard.sh 를 둔다 — 다만 이
; 대시보드는 janus.js 같은 외부 클라이언트 라이브러리를 받아 올 일도,
; 특별한 그룹 권한도 없어서 그 둘보다 짧다 (의존성 설치·빌드·프로세스·
; /health 만 본다).
;
;     cd services/coturn && ./setup-dashboard.sh --build
;     cd pm2 && pm2 start ecosystem.config.js --only coturn-dashboard && pm2 save
;     sudo ./nginx/install_nginx_stack.sh --skip-install

[service]
name    = coturn-dashboard
enabled = true

host  = 127.0.0.1
; ../settings.ini 의 dashboard_port 와 같은 값이어야 합니다 — 이 파일은
; nginx 가 실제로 프록시할 포트를 선언할 뿐, settings.ini 를 자동으로
; 따라가지 않습니다(install.sh --apply 가 건드리는 파일이 아닙니다).
; 기본값 28092 는 apartment-mgmt-server-node 의 huygens-server 가 이미
; 쓰고 있어(services/apartment-mgmt-server-node/nginx-conf/service.ini)
; 이 장비에서는 28090 으로 옮겼습니다.
ports = 28090

protocol    = http
health_path = /health

; location 기준 **상대 경로**입니다. manager 가 location + 이 값으로 링크를
; 만듭니다 (services/manager/server/src/services/registry.js 의 dashboardUrl).
dashboard_path = /dashboard

; /coturn/  → 관찰 웹,  /coturn/dashboard → 대시보드 화면
[route:main]
location = /coturn/
