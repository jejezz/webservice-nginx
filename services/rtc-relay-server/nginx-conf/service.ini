# rtc-relay-server 리버스 프록시 선언
# 스키마: ../../../docs/nginx-conf.md
#
# 이 서비스는 자체 HTTPS 서버다 (자체 서명 인증서). Android 단말은 포트 28099 로
# 직접 붙고, 사람은 Nginx 를 거쳐 대시보드를 본다. 그래서 protocol = https 로 두어
# Nginx 가 백엔드 TLS 검증을 건너뛰게 한다.
#
# 앱은 라우터를 '/' 와 '/iot' 양쪽에 붙여 두 경로 모두에 응답한다
# (proxy_pass 에 URI 가 없어 원본 경로가 그대로 전달되기 때문).

[service]
name        = rtc-relay-server
host        = 127.0.0.1
ports       = 28099
protocol    = https
health_path = /health

# 자체 대시보드 경로(/dashboard)는 pm2-conf 의 [env] DASHBOARD_PATH 에 있다.
# manager 가 location 과 합쳐 /iot/dashboard 링크를 만든다.
# ⚠️ location 과 src/index.ts 의 BASE_PATH 가 **같아야** 한다. proxy_path 를
#    비워 원본 URI 를 그대로 넘기므로, 어긋나면 그 경로가 통째로 404 가 된다.
#
# 끝의 슬래시는 그대로 둔다. 빼면 /iot 도 이 라우트에 걸리지만 /iotXYZ 까지
# 함께 걸린다. 클라이언트는 늘 더 깊은 경로(/iot/register/mobile 등)를 쓰므로
# 지금 형태로 충분하다.
[route:main]
location  = /iot/
websocket = true
