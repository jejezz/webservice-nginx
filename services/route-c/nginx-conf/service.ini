# 예제 서비스 route-c 리버스 프록시 선언
# 스키마: ../../../docs/nginx-conf.md
#
# 이관 전 nginx.ini 에서 ';' 로 주석 처리돼 있던 라우트다.
# 프로세스는 pm2 로 떠 있지만 Nginx 경로는 열지 않는다 —
# 열려면 enabled 를 true 로 바꾸고 install_nginx_stack.sh 를 다시 돌린다.
#
# 주의: 아래 포트는 이 서비스가 여는 내부 포트다.
# nginx-stack.conf 의 public_http_port(28080)는 공유기의 외부 포트라 별개다.

[service]
name        = route-c
host        = 127.0.0.1
ports       = 28082
protocol    = http
health_path = /health
enabled     = false

[route:main]
location  = /route-c/
websocket = false
