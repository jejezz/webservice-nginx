# 관리 대시보드 프로세스 선언
# 스키마: ../../../docs/pm2-conf.md

[app]
name   = nginx-manager
cwd    = server
script = src/index.js

max_restarts = 10
# 이관 전에 상한이 없었다. 기본값 256M 이 붙지 않게 명시한다.
max_memory_restart = none

[env]
NODE_ENV = production
# nginx-conf/service.ini 의 ports, config.json 의 port 와 같아야 한다.
PORT     = 28084
