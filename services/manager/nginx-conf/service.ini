# 관리 대시보드 리버스 프록시 선언
# 스키마: ../../../docs/nginx-conf.md

[service]
name        = manager
host        = 127.0.0.1
ports       = 28084
protocol    = http
health_path = /health

# 트레일링 슬래시 없이 지정해 /manager, /manager/ 둘 다 처리한다.
# proxy_path 를 비워 두면 원본 URI 가 그대로 전달된다 — manager 는
# config.json 의 basePath 가 '/manager' 라 그 경로를 자기가 해석한다.
#
# 루트 '/' 는 여기가 아니라 nginx-stack.conf 의 default_route 가
# 302 로 이 경로에 보낸다.
[route:main]
location = /manager
