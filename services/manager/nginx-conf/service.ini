# 서비스 관리 대시보드 리버스 프록시 선언
# 스키마: WebServices/docs/nginx-conf.md

[service]
name        = nginx-manager
host        = 127.0.0.1
ports       = 28084
protocol    = http
health_path = /health

# Nginx 의 기본 웹페이지를 대신해 루트에서 응답한다.
# 가장 짧은 접두사이므로 다른 어떤 location 도 먼저 매칭되고,
# 남는 요청(/, /login, /dashboard, /admin, /api/*, 정적 에셋)만 여기로 온다.
#
# proxy_path 를 비워 두면 원본 URI 가 그대로 전달된다.
# manager 는 basePath 가 '' 이라 루트 경로를 그대로 처리한다.
[route:root]
order    = 900
location = /
timeout  = 30
