#!KAMAILIO
#
# ┌───────────────────────────────────────────────────────────────────────────┐
# │  이 파일은 배포판 설정의 **포크** 입니다.                                  │
# │  services/kamailio/ 가 소유하고 install.sh 가 /etc/kamailio/ 로 설치합니다.│
# └───────────────────────────────────────────────────────────────────────────┘
#
# 원본: kamailio 5.5.4-1 패키지의 /etc/kamailio/kamailio.cfg (2022-02-18)
#
# ── 왜 포크했는가 ───────────────────────────────────────────────────────────
#
# 인터폰이 자고 있는 모바일로 걸 때, INVITE 를 붙들어 두고(tsilo) FCM 으로 단말을
# 깨운 뒤 등록되면 흘려보내야 합니다. 그 코드는 route[LOCATION] 과
# route[REGISTRAR] **안에** 들어가야 하는데, Kamailio 설정 언어에는 기존 라우트에
# 코드를 끼워 넣는 수단이 없습니다. (#!define 은 배포판이 미리 만들어 둔 자리에만
# 통합니다) 그래서 설정을 소유하는 것 외에 방법이 없었습니다.
#
# 흐름 전체는 docs/incoming-call.md 를 보세요.
#
# ── 원본과 다른 곳은 두 군데뿐입니다 ────────────────────────────────────────
#
#   모듈 로딩         tsilo · http_client — tm 뒤에 있어야 한다 (mod_init 의존)
#   route[REGISTRAR]  save() 뒤에 ts_append()  — 붙들어 둔 INVITE 를 새 contact 로
#   route[LOCATION]   lookup 실패 시 ts_store() + 푸시 요청 + 183/480 응답
#
# 두 곳 모두 "KAMAILIO-FORK" 로 표시해 두었습니다. 찾으려면:
#
#     grep -n KAMAILIO-FORK /etc/kamailio/kamailio.cfg
#
# 모듈 로딩(tsilo, http_async_client)과 새 라우트(SIP_PUSH_REPLY)는 **이 파일이
# 아니라 kamailio-local.cfg** 에 있습니다. 포크의 diff 를 작게 유지해, 패키지가
# 업그레이드될 때 원본과 비교하기 쉽게 하려는 것입니다.
#
# ── 패키지를 업그레이드할 때 ────────────────────────────────────────────────
#
# dpkg 는 이 파일이 바뀐 것을 알고 어떻게 할지 물어봅니다. 새 원본을 받은 뒤
# 위 두 표시를 다시 옮기세요. 차이를 보려면:
#
#     diff <(dpkg -L kamailio | grep kamailio.cfg | head -1 | xargs cat) /etc/kamailio/kamailio.cfg
#
# 아래부터는 원본 그대로입니다.
#
#
# Kamailio SIP Server v5.5 - default configuration script
#     - web: https://www.kamailio.org
#     - git: https://github.com/kamailio/kamailio
#
# Direct your questions about this file to: <sr-users@lists.kamailio.org>
#
# Refer to the Core CookBook at https://www.kamailio.org/wiki/
# for an explanation of possible statements, functions and parameters.
#
# Note: the comments can be:
#     - lines starting with #, but not the pre-processor directives,
#       which start with #!, like #!define, #!ifdef, #!endif, #!else, #!trydef,
#       #!subst, #!substdef, ...
#     - lines starting with //
#     - blocks enclosed in between /* */
# Note: the config performs symmetric SIP signaling
#     - it sends the reply to the source address of the request
#     - remove the use of force_rport() for asymmetric SIP signaling
#
# Several features can be enabled using '#!define WITH_FEATURE' directives:
#
# *** To run in debug mode:
#     - define WITH_DEBUG
#     - debug level increased to 3, logs still sent to syslog
#     - debugger module loaded with cfgtrace endabled
#
# *** To enable mysql:
#     - define WITH_MYSQL
#
# *** To enable authentication execute:
#     - enable mysql
#     - define WITH_AUTH
#     - add users using 'kamctl' or 'kamcli'
#
# *** To enable IP authentication execute:
#     - enable mysql
#     - enable authentication
#     - define WITH_IPAUTH
#     - add IP addresses with group id '1' to 'address' table
#
# *** To enable persistent user location execute:
#     - enable mysql
#     - define WITH_USRLOCDB
#
# *** To enable presence server execute:
#     - enable mysql
#     - define WITH_PRESENCE
#     - if modified headers or body in config must be used by presence handling:
#     - define WITH_MSGREBUILD
#
# *** To enable nat traversal execute:
#     - define WITH_NAT
#     - option for NAT SIP OPTIONS keepalives: WITH_NATSIPPING
#     - install RTPProxy: http://www.rtpproxy.org
#     - start RTPProxy:
#        rtpproxy -l _your_public_ip_ -s udp:localhost:7722
#
# *** To use RTPEngine (instead of RTPProxy) for nat traversal execute:
#     - define WITH_RTPENGINE
#     - install RTPEngine: https://github.com/sipwise/rtpengine
#     - start RTPEngine:
#        rtpengine --listen-ng=127.0.0.1:2223 ...
#
# *** To enable PSTN gateway routing execute:
#     - define WITH_PSTN
#     - set the value of pstn.gw_ip
#     - check route[PSTN] for regexp routing condition
#
# *** To enable database aliases lookup execute:
#     - enable mysql
#     - define WITH_ALIASDB
#
# *** To enable speed dial lookup execute:
#     - enable mysql
#     - define WITH_SPEEDDIAL
#
# *** To enable multi-domain support execute:
#     - enable mysql
#     - define WITH_MULTIDOMAIN
#
# *** To enable TLS support execute:
#     - adjust CFGDIR/tls.cfg as needed
#     - define WITH_TLS
#
# *** To enable JSONRPC over HTTP(S) support execute:
#     - define WITH_JSONRPC
#     - adjust event_route[xhttp:request] for access policy
#
# *** To enable anti-flood detection execute:
#     - adjust pike and htable=>ipban settings as needed (default is
#       block if more than 16 requests in 2 seconds and ban for 300 seconds)
#     - define WITH_ANTIFLOOD
#
# *** To block 3XX redirect replies execute:
#     - define WITH_BLOCK3XX
#
# *** To block 401 and 407 authentication replies execute:
#     - define WITH_BLOCK401407
#
# *** To enable VoiceMail routing execute:
#     - define WITH_VOICEMAIL
#     - set the value of voicemail.srv_ip
#     - adjust the value of voicemail.srv_port
#
# *** To enhance accounting execute:
#     - enable mysql
#     - define WITH_ACCDB
#     - add following columns to database
