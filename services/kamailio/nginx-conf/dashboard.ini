; Kamailio 관찰용 대시보드 (Node 서비스) 리버스 프록시 선언
; 스키마: ../../../docs/nginx-conf.md
;
; 같은 디렉토리의 service.ini 는 Kamailio 자체(SIP over WS)를 선언합니다.
; 한 디렉토리가 서비스 둘을 담는 것은 규약이 허용합니다 — nginx-conf.md 참고.
;
;   service.ini    kamailio            SIP over WS      5080  (systemd)
;   dashboard.ini  kamailio-dashboard  관찰용 웹        28086 (pm2)
;
; 이 서비스는 Kamailio 를 읽기만 합니다. 재시작하거나 설정을 바꾸지 않습니다.

[service]
name  = kamailio-dashboard
host  = 127.0.0.1
ports = 28086

protocol       = http
health_path    = /health
; location 기준 **상대 경로**다. manager 가 location + 이 값으로 링크를 만든다
; (services/manager/server/src/services/registry.js 의 dashboardUrl).
; 절대 경로(/kamailio/dashboard)를 적으면 /kamailio/kamailio/dashboard 가 된다.
dashboard_path = /dashboard

[route:main]
location = /kamailio/
