; Kamailio SIP 서버 리버스 프록시 선언
; 스키마: ../../../docs/nginx-conf.md
;
; Kamailio 는 pm2 가 아니라 systemd 가 띄웁니다 (pm2-conf/app.ini 참고).
; 그래도 라우팅 선언은 다른 서비스와 같은 자리에 둡니다 — manager 대시보드가
; services/*/nginx-conf/ 를 훑어 서비스 목록을 만들기 때문입니다.
;
; --- 지금은 꺼 둡니다 ---
;
; ⛔ 꺼 두었습니다 (2026-08-21) — 쓸 클라이언트가 없습니다.
;
; 이 경로는 단말이 SIP 를 직접 말하는(wss://…/sip/) 길이었습니다. 브라우저도
; 모바일도 **Janus 로 붙기로 정하면서** 그 길을 쓸 사람이 없어졌습니다.
;
;   브라우저 · 모바일   → /janus-api  (WSS + DTLS-SRTP)
;   LAN SIP 단말        → 평문 UDP 5060
;
; 지우지 않고 끄는 이유는 ../docs/websocket-plan.md 가 1단계까지 실제로 해 본
; 기록이기 때문입니다. 파일을 지우면 그 문서가 실물 없는 계획서가 됩니다.
; 다시 열려면 이 값을 true 로 바꾸고 ./nginx/install_nginx_stack.sh --check 로
; 확인한 뒤 반영하면 됩니다.
;
; ⚠️ enabled = false 인 서비스는 생성기가 스캔 단계에서 건너뜁니다 — 포트·경로
;    충돌 검사도 받지 않습니다. 다시 켤 때 그 검사를 처음 받는 셈입니다.
;
; 결정의 경위: ../docs/mobile-transport.md 7절 · ../../janus/docs/plan.md 10-3

[service]
name    = kamailio
enabled = true

host  = 127.0.0.1
; Kamailio 가 평문 WS 를 들을 포트. TLS 는 nginx 가 끊습니다.
; (Kamailio 가 직접 TLS 를 끊는 대안은 websocket-plan.md 의 (b)안)
ports = 5080

protocol = http

; Kamailio 는 HTTP 서비스가 아니라 /health 를 기본 제공하지 않습니다.
; xhttp 모듈로 만들어 넣어야 하며, 그 방법은 websocket-plan.md 에 적어 두었습니다.
; enabled = false 인 동안에는 라우트 자체가 없으므로 문제되지 않습니다.
health_path = /health

; SIP over WebSocket (RFC 7118).
;
; proxy_path 를 비워 원본 URI 를 그대로 넘깁니다 — 이 프로젝트의 기본입니다.
; timeout 을 크게 잡는 이유: 등록만 유지하는 유휴 WS 연결이 많고, nginx 기본
; 60초에 걸리면 단말이 계속 재접속합니다. SIP 등록 갱신 주기보다 길어야 합니다.
[route:sip]
location  = /sip/
websocket = true
timeout   = 3600
