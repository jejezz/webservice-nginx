; kamailio-dashboard 프로세스 선언
; 스키마: ../../../docs/pm2-conf.md
;
; 같은 디렉토리의 app.ini 는 Kamailio 자체이고 껍데기입니다 (systemd 가 띄움).
; 이쪽은 진짜 프로세스입니다.
;
; ⚠️ **kamailio 그룹으로 실행되어야 합니다.**
;    Kamailio 상태를 JSON-RPC FIFO(/run/kamailio/kamailio_rpc.fifo)로 읽는데,
;    그 디렉토리가 drwxrwx--- kamailio:kamailio 이기 때문입니다.
;
;      sudo usermod -aG kamailio <pm2 를 돌리는 사용자>
;
;    **usermod 만으로는 부족합니다.** 보조 그룹은 로그인할 때 정해져서, 이미 떠 있는
;    셸과 그 셸이 띄운 pm2 데몬은 옛 그룹 집합을 그대로 씁니다. usermod 을 하고
;    pm2 를 재시작했는데도 안 되는 상황이 실제로 있었습니다 — /etc/group 에는
;    등록돼 있어 겉으로는 다 맞아 보입니다.
;
;      ① 다시 로그인한 뒤 (권장, 재부팅 후에도 유효)
;          pm2 kill && cd <프로젝트>/pm2 && pm2 start ecosystem.config.js && pm2 save
;
;      ② 로그아웃 없이 (임시 조치 — 데몬의 기본 그룹이 kamailio 가 됩니다)
;          pm2 kill
;          sg kamailio -c "cd <프로젝트>/pm2 && pm2 start ecosystem.config.js && pm2 save"
;
;    pm2 restart 로는 바뀌지 않습니다 — 데몬이 자식에게 그룹을 물려주므로
;    데몬 자체를 다시 띄워야 합니다. 그래서 pm2 kill 이 필요합니다.
;
;    확인:  ../setup-dashboard.sh
;           grep ^Groups: /proc/$(pm2 pid kamailio-dashboard)/status   → 143 이 있어야 함
;
;    닿지 않으면 대시보드 화면과 pm2 로그에 원인과 해결 방법이 그대로 표시됩니다.

[app]
name   = kamailio-dashboard
cwd    = server
script = src/index.js

[env]
NODE_ENV = production
PORT     = 28086
