#!KAMAILIO
#
# Kamailio 로컬 오버라이드.
#
# 배포판 기본 설정(/etc/kamailio/kamailio.cfg)의 127행에 아래 줄이 이미 있다.
#
#     import_file "kamailio-local.cfg"
#
# 그 지점은 defines 구역(129행~)과 모듈 로딩(252행~)보다 앞이므로,
# 여기서 정의한 값이 그대로 반영된다.
# 덕분에 배포판 설정 파일을 한 줄도 고치지 않아도 된다. (패키지 업그레이드에도 안전)
#
# install.sh 가 이 파일을 /etc/kamailio/kamailio-local.cfg 로 설치하면서
# __DBURL__ 자리를 database/secrets/kamailio.pw 의 값으로 채운다.
# 직접 설치한다면 그 자리를 손으로 채우고 권한을 좁혀야 한다.
#
#     sudo install -o root -g kamailio -m 640 kamailio-local.cfg /etc/kamailio/
#
# 되돌리려면 이 파일을 지우고 kamailio 를 재시작하면 된다. 기본 설정으로 돌아간다.

# --- 데이터베이스 ---
# 이 define 이 있어야 db_mysql.so 가 로드된다.
#!define WITH_MYSQL

# 기본 설정 141행의 #!trydef DBURL 보다 먼저 정의되므로 이쪽이 이긴다.
# (trydef 는 이미 정의된 값을 덮어쓰지 않는다)
#!define DBURL "__DBURL__"

# --- SIP 도메인 ---
#
# 이 도메인을 Kamailio 가 "내 것" 으로 인식하게 한다. 없으면 route[SIPOUT] 의
#     if (uri==myself) return;
# 에 걸리지 않아, 이 도메인으로 온 REGISTER 를 **외부로 릴레이하려고 한다.**
# 등록도 인증도 되지 않는다.
#
# 인증 realm 은 설정 상수가 아니라 클라이언트가 보낸 From 도메인($fd)이다.
#     if (!auth_check("$fd", "subscriber", "1")) { auth_challenge("$fd", "0"); }
# 즉 단말이 sip:1001@pluto.org 로 등록하면 subscriber(1001, pluto.org)를 찾는다.
# 그래서 이 alias 와 subscriber.domain 과 단말 설정이 모두 같아야 한다.
#
# 값은 install.sh 의 SIP_DOMAIN 에서 주입된다 — 그쪽이 단일 출처다.
alias=__SIP_DOMAIN__

# --- SIP 를 받을 주소 ---
#
# ⚠️ listen= 을 **하나라도** 적으면 Kamailio 는 인터페이스 자동 탐색을 멈추고
#    적힌 것만 연다. WS 용 5080 만 적었다가 인터폰이 쓰는 5060 이 통째로 닫힌
#    적이 있다. WS(kamailio-websocket.cfg)와 SIP(여기)를 함께 적어야 한다.
#
# 자동 탐색은 docker0(172.17.0.1)·virbr0(192.168.122.1)까지 잡았는데 SIP 에는
# 필요 없다. LAN 과 루프백만 연다.
listen=udp:__SIP_LISTEN_ADDR__:5060
listen=tcp:__SIP_LISTEN_ADDR__:5060
listen=udp:127.0.0.1:5060
listen=tcp:127.0.0.1:5060

# --- 인증 ---
# auth.so / auth_db.so 를 로드하고 route[AUTH] 의 인증 분기를 활성화한다.
# 이 define 이 없으면 REGISTER 가 인증 없이 통과한다.
#!define WITH_AUTH

# --- 아래는 필요해질 때 주석을 푼다 ---

# 등록 정보를 메모리 대신 DB에 저장한다. (재시작해도 등록이 유지됨)
# location / location_attrs 테이블이 필요하므로 schema/ 에 SQL 을 추가한 뒤 켤 것.
##!define WITH_USRLOCDB

# IP 기반 인증. address 테이블에 등록한 주소는 digest 인증을 건너뛴다.
# ws-bridge 를 비밀번호 없이 붙이고 싶을 때 쓸 수 있으나, digest 인증을 구현해 두었으므로
# 권장하지 않는다.
##!define WITH_IPAUTH

# 통화 기록을 DB에 남긴다. acc / missed_calls 테이블이 필요하다.
##!define WITH_ACCDB

# --- SIP over TLS ---
#
# setup-tls.sh --enable 이 /etc/kamailio/kamailio-tls.cfg 를 설치하면 여기서 읽어
# 들인다. WS 와 같은 이유로 파일을 나눴다 — 스크립트 하나가 파일 하나를 소유한다.
#
# **WS 와 별개로 필요하다.** 모바일 앱이 PJSIP 기반인데 PJSIP 에는 WebSocket
# 전송이 없어서(pjsip_transport_type_e 는 UDP/TCP/TLS/DTLS/SCTP/LOOP 뿐), nginx 가
# 끊어 주는 wss://…/sip/ 경로를 그 앱은 쓸 수 없다. 네이티브 SIP UA 에게 그에
# 대응하는 것이 SIP over TLS 다.
#
# ⛔ **지금 이 파일은 설치되지 않습니다.** Kamailio 5.5.4 의 tls 모듈은 이
#    배포판의 OpenSSL 3 과 함께 쓰면 기동 중에 힙을 깨뜨립니다. 지금은 nginx 의
#    stream 모듈이 5061 에서 TLS 를 끊고 평문 TCP 5060 으로 넘깁니다
#    (nginx-sip-tls.conf · setup-tls.sh).
#
#    이 줄은 남겨 둡니다 — import_file 은 대상이 없어도 오류가 아니고,
#    Kamailio 를 5.6+ 로 올리면 그때 파일만 설치하면 되기 때문입니다.
#    ⚠️ 그전에 손으로 설치하지 마세요. kamailio 가 코어를 뱉고 죽습니다.
import_file "kamailio-tls.cfg"

# --- SIP over WebSocket ---
#
# setup-websocket.sh --enable 이 /etc/kamailio/kamailio-websocket.cfg 를 설치하면
# 여기서 읽어 들인다. import_file 은 대상이 없어도 오류가 아니므로, WS 를 쓰지
# 않는 동안에는 이 줄이 아무 일도 하지 않는다.
#
# 파일을 나눈 이유: 인증 설정(이 파일)은 install.sh 가, WS 전송은
# setup-websocket.sh 가 소유한다. 한 파일을 두 스크립트가 쓰면 어느 쪽이
# 최신인지 알 수 없게 된다.
import_file "kamailio-websocket.cfg"

# --- 착신 푸시 (인터폰 → 자는 모바일) ---
#
# 흐름 전체는 docs/incoming-call.md 를 보세요.
#
# **모듈 로딩은 여기 두지 않습니다.** tsilo 는 tm 이 초기화된 뒤에 초기화되어야
# 하는데, 이 파일은 127행에서 import 되고 tm 은 302행에서 로드됩니다. 여기서
# tsilo 를 로드하면 기동할 때 이렇게 죽습니다.
#
#     tm [tm_load.c:33]: load_tm(): Module not initialized yet,
#     make sure that all modules that need tm module are loaded after tm
#     tsilo [tsilo.c:135]: mod_init(): can't load TM API
#
# ⚠️ **kamailio -c 는 이것을 잡지 못합니다.** -c 는 파싱과 모듈 로딩까지만 보고
#    mod_init 은 실제 기동 때만 돕니다. 검사를 통과하고도 죽었습니다.
#
# 그래서 loadmodule / modparam 은 kamailio.cfg(포크)의 tm 로드 직후에 두었습니다.
# 여기 남는 것은 라우트 밖 · 모듈 무관인 define 뿐입니다.

#!define SIP_PUSH_URL "__SIP_PUSH_URL__"

# route[SIP_PUSH_REPLY] 는 여기 둘 수 없어 kamailio.cfg(포크) 쪽에 있습니다.
#
# 그 라우트는 t_reply 와 xlog 를 쓰는데, tm.so / xlog.so 는 배포판 설정 262행
# 부근에서 로드됩니다. 이 파일은 127행에서 import 되므로 그 시점에는 두 함수를
# 모릅니다 ("unknown command, missing loadmodule?").
#
# 여기서 직접 loadmodule 하면 배포판이 나중에 또 로드해 "load the same module
# twice" 로 기동이 막힙니다. 그래서 라우트는 포크 쪽에 두었습니다.
