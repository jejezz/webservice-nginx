# SIP over TLS — nginx 가 TLS 를 끊고 Kamailio 로 평문 TCP 를 넘긴다.
#
# setup-tls.sh --enable 이 이 파일을 /etc/nginx/streams-enabled/ 로 설치하고,
# nginx.conf 최상위에 그 디렉토리를 읽는 include 한 줄을 넣는다.
#
#   [단말] ──TLS──▶ [nginx stream :5061] ──평문 TCP──▶ [kamailio 127.0.0.1:5060]
#
# --- 왜 Kamailio 가 직접 TLS 를 끊지 않는가 ---
#
# 처음에는 Kamailio 의 tls 모듈로 만들었고 설정 검사까지 통과했지만, 기동하는
# 순간 죽었습니다.
#
#     CRITICAL: qm_debug_check_frag(): BUG: qm: fragm. end overwritten (0, 0)!
#     Memory allocator was called from tls: tls_init.c:323
#
# Kamailio 5.5.4 의 tls 모듈은 CRYPTO_set_mem_functions() 로 OpenSSL 의 할당자를
# Kamailio 것으로 바꿉니다. 이 배포판의 OpenSSL 은 3.0.2 인데 5.5 는 OpenSSL 3 이
# 나오기 전 코드라, 그 조합에서 힙이 깨집니다. Kamailio 는 5.6 부터 이것을
# 제대로 다루고, 5.5.4 에는 우회할 모듈 파라미터가 없습니다.
#
# nginx 는 이미 OpenSSL 3 위에서 TLS 를 잘 끊고 있으므로 그쪽에 맡깁니다.
# WS 를 nginx 가 끊기로 한 것과 같은 판단이고(docs/websocket-plan.md ②),
# 그래서 구조가 하나로 모입니다.
#
# 나중에 Kamailio 를 5.6+ 로 올리면 kamailio-tls.cfg 로 옮길 수 있습니다.
# 그 파일은 그때를 위해 남겨 두었고, 지금은 설치하지 않습니다.
#
# --- 감수하는 것 ---
#
# Kamailio 가 보는 소스 주소가 **항상 127.0.0.1** 입니다. WS 와 같은 대가이고
# 이미 받아들이기로 한 것입니다 — IP 기반 ACL 은 의미가 없어지지만, 인증은
# digest 로 하고 라우팅은 연결 자체를 따라가므로 문제되지 않습니다.
#
# ⚠️ 확인이 필요한 지점: Kamailio 는 이 연결을 TCP 로 보므로 Record-Route 에
#    transport=tcp 를 씁니다. 단말은 TLS 로 알고 있어서, in-dialog 요청에서
#    어긋날 여지가 있습니다. 실제로는 단말이 기존 연결을 재사용하고 Kamailio 가
#    alias 로 되돌리므로 대체로 통과합니다. 등록이 된 뒤 통화까지 이어서
#    확인하세요 — 등록만 보고 넘어가면 놓칩니다.

server {
    # 외부 단말이 붙는 곳. 공유기에서 이 주소·포트로 포워딩이 필요하다.
    # __SIP_LISTEN_ADDR__ 는 setup-tls.sh 가 치환한다 — 값은 새로 정하지 않고
    # 설치된 kamailio-local.cfg 의 listen= 에서 읽어온다.
    listen __SIP_LISTEN_ADDR__:5061 ssl;

    # nginx 의 http 쪽과 **같은 인증서**를 그대로 쓴다.
    # nginx master 는 root 라 0600 짜리 키를 읽을 수 있다 — Kamailio 로 갔다면
    # 필요했을 사본이 여기서는 필요 없다.
    ssl_certificate     __CERT_FILE__;
    ssl_certificate_key __KEY_FILE__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SIP_TLS:4m;
    ssl_session_timeout 1h;

    # 클라이언트 인증서는 요구하지 않는다. 단말 인증은 SIP digest 가 한다.

    proxy_pass 127.0.0.1:5060;

    # ⚠️ 유휴 시간. 등록만 유지하는 연결은 갱신 주기 동안 조용하므로, 기본값
    #    10분이면 그 사이에 끊깁니다. 끊기면 단말은 다시 핸드셰이크를 해야 하고,
    #    무엇보다 **그동안 착신 INVITE 를 밀어 넣을 연결이 사라집니다.**
    #    등록 갱신 주기보다 넉넉히 길게 잡습니다.
    proxy_timeout          3600s;
    proxy_connect_timeout  5s;

    # 죽은 연결을 커널이 정리하게 한다. 모바일은 통보 없이 사라지는 일이 흔하다.
    proxy_socket_keepalive on;
}
