#!KAMAILIO
#
# SIP over WebSocket (RFC 7118) 오버라이드.
#
# setup-websocket.sh --enable 이 이 파일을 /etc/kamailio/kamailio-websocket.cfg 로
# 설치합니다. kamailio-local.cfg 끝의 import_file 이 읽어 들입니다.
#
#   /etc/kamailio/kamailio.cfg          배포판. 한 줄도 고치지 않는다
#     └ 127행 import_file kamailio-local.cfg        install.sh 가 설치 (인증)
#         └ import_file kamailio-websocket.cfg      이 파일 (WS 전송)
#
# import_file 은 대상이 없어도 오류가 아니므로, 이 파일을 지우면 WS 만 꺼지고
# 인증 설정은 그대로 남습니다.
#
# --- 왜 이렇게 할 수 있는가 ---
#
# 배포판 kamailio.cfg 에는 WITH_WEBSOCKET 스위치가 없습니다. 그런데 WS handshake 를
# 처리할 event_route[xhttp:request] 와 xhttp.so 로드가 둘 다 #!ifdef WITH_JSONRPC
# 아래에 있고, 그 스위치는 꺼져 있습니다. 즉 자리가 비어 있어서 여기서 직접
# 채울 수 있습니다.
#
# WITH_JSONRPC 를 켜면 event_route 가 중복 정의되어 기동이 막힙니다
# ("duplicate route"). setup-websocket.sh 가 그 상태를 점검합니다.
#
# 검증 내용은 docs/websocket-plan.md 에 있습니다.

# --- NAT / alias 처리 ---
#
# WS 클라이언트의 Contact 는 도달할 수 없는 주소(보통 .invalid 도메인)입니다.
# Kamailio 가 그 단말로 되돌아가려면 등록 시 실제 연결을 기억해야 합니다.
#
# 배포판 설정은 그 처리를 이미 갖추고 있고 #!ifdef WITH_NAT 로만 막아 두었습니다.
#   route[NATDETECT]  fix_nated_register() / set_contact_alias()
#   route[RELAY] 등    handle_ruri_alias()
# 여기서 define 만 켜면 그 코드가 살아납니다. (request_route 자체는 배포판이
# 소유하므로 오버라이드로 고칠 수 없습니다 — 그래서 define 이 유일한 경로입니다)
#
# ⚠️ 이 스위치는 WS 뿐 아니라 **기존 UDP 단말의 처리도 바꿉니다.**
#    nathelper.so / rtpengine.so / rtpproxy.so 가 함께 로드됩니다.
#    운영 중인 SIP 에 영향이 가므로 점검 창에서 적용하세요.
#
# ⚠️ 지금은 **kamailio-local.cfg 가 이 값을 켭니다** (미디어 릴레이는 WS 와
#    무관하게 필요하기 때문입니다). 여기서는 그쪽이 없을 때만 켜도록 감쌉니다 —
#    양쪽에서 그냥 #!define 하면 파서가 'already defined: WITH_NAT' 로 죽습니다.
#!ifndef WITH_NAT
#!define WITH_NAT
#!endif

# --- 미디어 릴레이 ---
#
# 켜면 route[NATMANAGE] 가 rtpproxy 대신 rtpengine 을 부릅니다. WITH_NAT 과 마찬가지로
# 배포판이 갖춰 둔 것을 define 으로만 여는 것이라 오버라이드에서 됩니다
# (kamailio -c 통과 확인).
#
# **rtpengine 데몬이 뜬 뒤에 켜세요.** 데몬이 없으면 rtpengine_manage() 가 실패해
# NAT 뒤 단말(= 외부 모바일)과의 통화에 미디어가 붙지 않습니다. 같은 LAN 안의
# 인터폰끼리는 아래 이유로 영향이 없습니다.
#
# 내부↔내부 통화는 자동으로 rtpengine 을 건너뜁니다. route[NATMANAGE] 첫머리가
#     if (!(isflagset(FLT_NATS) || isbflagset(FLB_NATB))) return;
# 이고, FLT_NATS 는 상대가 NAT 뒤일 때만 서기 때문입니다. 미디어가 서버를 거치지
# 않고 직접 흐르므로 대역폭과 지연에서 이득입니다.
#
# 데몬 설정은 이 디렉토리의 rtpengine.conf 를 보세요.
#
# ⚠️ 이 줄은 **주석으로 둡니다.** 지금은 kamailio-local.cfg 가 이 값을 켭니다 —
#    24.04 에서는 rtpproxy 가 저장소에서 빠져 rtpengine 이 기본 경로가 됐고,
#    그것은 WS 를 쓰든 안 쓰든 필요합니다 (README 의 4-4 절). 여기서 다시 켜면
#    'already defined' 로 파서가 죽습니다.
##!define WITH_RTPENGINE

# --- TCP 코어 설정 ---
#
# **없으면 WebSocket 이 통째로 안 됩니다.**
#
# SIP over TCP 는 Content-Length 를 요구하지만, HTTP/1.1 은 본문이 없으면 그 헤더를
# 붙이지 않습니다. WebSocket handshake 가 바로 그런 요청(본문 없는 GET)이라, 이
# 설정이 없으면 Kamailio 의 TCP 리더가 본문을 기다리며 **아무 응답도 하지 않습니다.**
#
# 포트는 열려 있고 프로세스도 정상이라 systemctl 로는 멀쩡해 보입니다. 실제로
# 확인해 보면 이렇게 갈립니다.
#     curl http://127.0.0.1:5080/health                    → 응답 없음
#     curl -H 'Content-Length: 0' http://127.0.0.1:5080/health → 200 OK
#
# setup-websocket.sh 가 설치 후 이 검사를 자동으로 합니다.
tcp_accept_no_cl=yes

# --- 모듈 ---
#
# xhttp 는 WS handshake 가 올라타는 HTTP 처리입니다. 배포판은 WITH_JSONRPC
# 아래에서만 로드하므로 여기서 직접 로드합니다.
loadmodule "xhttp.so"
loadmodule "websocket.so"

# --- 소켓 ---
#
# nginx 가 TLS 를 끊고 평문 WS 로 넘깁니다 (nginx-conf/service.ini 의 ports 와
# 같은 값이어야 합니다). 루프백에만 묶어 두어 nginx 를 우회한 접근을 막습니다.
#
# Kamailio 가 직접 WSS 를 끊는 대안은 websocket-plan.md 의 (b)안입니다.
# 그 경우 kamailio-tls-modules 가 필요하고 이 줄이 tls: 로 바뀝니다.
# ⚠️ listen= 을 하나라도 적으면 Kamailio 는 인터페이스 자동 탐색을 멈추고 적힌
#    것만 연다. 그래서 SIP 용 5060 은 kamailio-local.cfg 가 함께 명시한다.
#    이 파일만 두고 그쪽을 빠뜨리면 SIP 가 통째로 닫힌다 (실제로 겪었다).
listen=tcp:127.0.0.1:5080

# --- websocket 모듈 설정 ---
#
# keepalive_mechanism  1 = Kamailio 가 주기적으로 WS ping 을 보낸다.
#                      유휴 연결이 중간 장비(nginx 포함)에서 끊기는 것을 막는다.
# keepalive_timeout    이 시간(초) 동안 조용한 연결에 ping 을 보낸다.
#                      nginx 의 proxy_read_timeout(service.ini 의 timeout) 보다
#                      **작아야** 합니다. 크면 nginx 가 먼저 끊습니다.
modparam("websocket", "keepalive_mechanism", 1)
modparam("websocket", "keepalive_timeout", 30)
modparam("websocket", "keepalive_processes", 1)

# --- HTTP 요청 처리 ---
#
# 두 가지를 받습니다.
#   1. /health  — 이 프로젝트의 서비스 상태 규약 (docs/health-contract.md)
#   2. 그 외    — WS handshake 시도
#
# 배포판이 WITH_JSONRPC 아래에 두었던 것과 같은 event_route 이름이므로,
# 그 스위치가 켜지면 충돌합니다.
event_route[xhttp:request] {
	# 헬스 체크. nginx 를 거쳐 manager 대시보드가 부릅니다.
	#
	# 다른 서비스와 같은 형식을 지킵니다. Kamailio 설정 언어로는 uptime 이나
	# 메모리 같은 값을 얻기 번거로우므로 최소 필드만 냅니다 — 규약이 요구하는
	# service 와 status 는 채웁니다.
	if ($hu =~ "^/health") {
		set_reply_close();
		set_reply_no_connect();
		xhttp_reply("200", "OK", "application/json",
			'{"service":"kamailio","status":"ok"}');
		exit;
	}

	# WebSocket handshake. 성공하면 이 연결은 이후 SIP 를 실어 나릅니다.
	if (ws_handle_handshake()) {
		exit;
	}

	# handshake 도 /health 도 아니면 거절합니다.
	set_reply_close();
	set_reply_no_connect();
	xhttp_reply("404", "Not Found", "text/plain", "");
	exit;
}
