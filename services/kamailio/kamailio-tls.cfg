#!KAMAILIO
#
# ============================================================================
# ⛔ 이 파일은 **지금 쓰이지 않습니다.** 설치하면 Kamailio 가 죽습니다.
# ============================================================================
#
# Kamailio 5.5.4 의 tls 모듈은 CRYPTO_set_mem_functions() 로 OpenSSL 의 할당자를
# Kamailio 것으로 바꾸는데, 이 배포판의 OpenSSL 3.0.2 와는 그것이 성립하지 않아
# 기동 중에 힙이 깨집니다. 설정 검사(kamailio -c)는 통과하고 리스너까지 정상으로
# 잡히므로, 재시작하는 순간에야 드러납니다.
#
#     CRITICAL: qm_debug_check_frag(): BUG: qm: fragm. end overwritten (0, 0)!
#     Memory allocator was called from tls: tls_init.c:323
#
# 5.5.4 에는 우회할 모듈 파라미터가 없습니다 (low_mem_threshold1/2 뿐).
# Kamailio 는 5.6 부터 OpenSSL 3 을 제대로 다룹니다.
#
# **그래서 지금은 nginx 가 TLS 를 끊습니다** — nginx-sip-tls.conf 와
# setup-tls.sh 를 보세요. Kamailio 는 평문 TCP 5060 만 듣습니다.
#
# 이 파일은 **Kamailio 를 5.6+ 로 올렸을 때**를 위해 남겨 둡니다. 그때는
#   1. setup-tls.sh 의 nginx stream 을 --disable 로 걷어내고
#   2. 이 파일을 /etc/kamailio/kamailio-tls.cfg 로 설치하고
#   3. tls.cfg(인증서 경로)를 만들고
#   4. kamailio-local.cfg 의 import_file 이 이미 있으므로 그대로 두면 됩니다
# 순서로 옮길 수 있습니다. 아래 내용은 5.5.4 에서 kamailio -c 를 통과한 것이라
# 그대로 재사용할 수 있습니다.
#
# ----------------------------------------------------------------------------
# 아래는 원래 머리말입니다.
# ----------------------------------------------------------------------------
#
# SIP over TLS (RFC 3261 §26.3.1) 오버라이드.
#
# setup-tls.sh --enable 이 이 파일을 /etc/kamailio/kamailio-tls.cfg 로 설치합니다.
# kamailio-local.cfg 의 import_file 이 읽어 들입니다.
#
#   /etc/kamailio/kamailio.cfg          배포판 포크. install.sh 가 설치
#     └ 127행 import_file kamailio-local.cfg        install.sh 가 설치 (인증)
#         ├ import_file kamailio-tls.cfg            이 파일 (TLS 전송) ← 먼저
#         └ import_file kamailio-websocket.cfg      setup-websocket.sh (WS 전송)
#
# import_file 은 대상이 없어도 오류가 아니므로, 이 파일을 지우면 TLS 만 꺼지고
# 인증과 WS 는 그대로 남습니다.
#
# --- 왜 WS 가 아니라 TLS 인가 ---
#
# 모바일 앱이 PJSIP 기반인데 **PJSIP 에는 WebSocket 전송이 없습니다.**
# pjsip_transport_type_e 는 UDP / TCP / TLS / DTLS / SCTP / LOOP 뿐이고,
# libpjsua2.so 에 websocket 문자열이 하나도 없는 것도 확인했습니다.
#
# 그래서 nginx 가 끊어 주는 wss://…/sip/ 경로를 그 앱은 쓸 수 없습니다.
# 네이티브 SIP UA 에게 그에 대응하는 것이 SIP over TLS 입니다.
# WS 경로(브라우저·ws-bridge 용)는 그대로 둡니다 — 둘은 독립입니다.
#
# ============================================================================
# ⚠️ #!define WITH_TLS 를 쓰지 않습니다. 반드시 읽어 주세요.
# ============================================================================
#
# 배포판에는 WITH_TLS 스위치가 있고, 처음에는 그것을 켜는 것으로 만들었습니다.
# **동작하지 않습니다.** 기동 전 검사에서 이렇게 걸립니다.
#
#     ERROR: tls [tls_init.c:611]: tls_pre_init():
#            Unable to set the memory allocation functions
#     ERROR: tls: Be sure tls module is loaded before any other module
#            using libssl (can be loaded first to be safe)
#     ERROR: load_module(): tls.so: mod_register failed
#
# 원인은 로드 순서입니다. 배포판은 tls.so 를 **379행**에서 로드하는데, 그보다
# 앞선 **318행의 http_client.so** 가 libcurl 을 통해 OpenSSL 을 먼저 초기화해
# 버립니다. 그러면 tls.so 가 자기 메모리 할당자를 심지 못하고 mod_register 에서
# 실패합니다. OpenSSL 3 은 이미 할당이 일어난 뒤의 CRYPTO_set_mem_functions() 를
# 거부하기 때문입니다.
#
# 실측으로 좁혔습니다 — 배포판 설정에서 한 줄씩 빼며 확인했습니다.
#
#     원본 그대로        → 재현
#     http_client 제거   → 오류 사라짐   ← 이것이 원인
#     db_mysql 제거      → 여전히 재현
#
# http_client 는 이 배치에 특유합니다. 착신 푸시(docs/incoming-call.md)가
# 쓰라고 포크가 넣은 모듈이라, 배포판만 쓰는 곳에서는 이 문제를 만나지 않습니다.
#
# 해결은 tls.so 를 **모든 모듈보다 먼저** 로드하는 것입니다. 이 파일은 127행에서
# import 되어 배포판의 모듈 블록(294행~)보다 앞서므로, 여기서 직접 로드하면
# 순서가 맞습니다. 오류 메시지가 권하는 것도 바로 그것입니다.
#
# 그래서 WITH_TLS 는 켜지 않습니다 — 켜면 배포판이 379행에서 **한 번 더** 로드해
# "load the same module twice" 로 기동이 막힙니다. 대신 그 스위치가 해 주던 일
# (enable_tls · tls_max_connections · modparam)을 아래에서 직접 합니다.
#
# ⚠️ 그러므로 이 파일은 kamailio-websocket.cfg 보다 **먼저** import 되어야 합니다.
#    websocket.so 도 libcrypto 를 링크합니다. 실측으로는 그 순서가 문제되지
#    않았지만, tls 모듈 문서가 "가장 먼저" 를 권하므로 그대로 따릅니다.

# --- 코어 TLS ---
#
# ⚠️ **loadmodule 보다 앞에 있어야 합니다.** tls.so 의 mod_register() 는 로드
#    시점에 이 값을 보고, 꺼져 있으면 TLS 훅을 아예 등록하지 않습니다.
#    뒤에 두면 이런 경고가 뜨는데,
#
#      WARNING: tls [tls_mod.c:617]: mod_register():
#               tls support is disabled (set enable_tls=1 in the config to enable it)
#
#    **kamailio -c 는 그래도 통과합니다.** 설정은 멀쩡해 보이고 기동도 되는데
#    TLS 만 조용히 안 되는 형태가 됩니다. 배포판도 251행(enable_tls)이
#    379행(loadmodule)보다 앞이라 같은 순서입니다.
enable_tls=yes
tls_max_connections=2048

# ⚠️ tls_handshake_timeout / tls_send_timeout 은 여기 두지 마세요.
#    배포판 빌드는 TLS 를 모듈로 만들었지 코어에 넣지 않아서
#      warning: tls-in-core support not compiled in
#    이 뜨고 값은 무시됩니다. 핸드셰이크 관련 조정은 tls.cfg 쪽에서 합니다.

# --- 모듈 ---
#
# 이 줄이 **전체 설정에서 첫 loadmodule** 이어야 합니다. 위 설명 참고.
loadmodule "tls.so"

# 인증서 경로 등은 별도 파일에 있습니다. 형식이 Kamailio 설정이 아니라 ini 라
# 여기 담을 수 없습니다. setup-tls.sh 가 만듭니다.
#
# (배포판 541행이 같은 modparam 을 WITH_TLS 아래에 두고 있지만, 그 스위치를
#  켜지 않으므로 여기서 직접 지정합니다)
modparam("tls", "config", "/etc/kamailio/tls.cfg")

# --- 소켓 ---
#
# ⚠️ listen= 을 하나라도 적으면 Kamailio 는 인터페이스 자동 탐색을 멈추고 적힌
#    것만 엽니다. SIP 용 5060 은 kamailio-local.cfg 가, WS 용 5080 은
#    kamailio-websocket.cfg 가 각자 명시합니다. 셋이 모두 있어야 온전합니다.
#
# 5061 은 SIPS 표준 포트입니다. 외부 단말이 붙어야 하므로 루프백이 아니라
# LAN 주소에 묶습니다 — 공유기에서 이 포트로 포워딩이 필요합니다.
#
# __SIP_LISTEN_ADDR__ 는 setup-tls.sh 가 치환합니다. 값은 새로 정하지 않고
# 이미 설치된 kamailio-local.cfg 의 listen= 에서 읽어옵니다 — SIP 와 TLS 가
# 다른 주소에 뜨는 사고를 막기 위해서입니다.
listen=tls:__SIP_LISTEN_ADDR__:5061

# --- TCP/TLS 연결 수명 ---
#
# TLS 는 TCP 위에 있으므로 TCP 타이머의 지배를 받습니다. 기본값(120초)이면
# 유휴 등록 연결이 끊기고, 단말은 그때마다 핸드셰이크를 다시 합니다.
# 모바일에서는 배터리와 착신 지연 양쪽에 손해입니다.
#
# 등록 갱신 주기보다 넉넉히 길게 잡습니다. 연결이 살아 있으면 서버가 그 연결로
# 착신 INVITE 를 그대로 밀어 넣을 수 있습니다 — 이것이 TLS 를 쓰는 실질적인
# 이득이고, 나중에 FCM 푸시를 덜 쓰게 만드는 부분이기도 합니다.
#
# ⚠️ 이것은 **코어 설정이라 모든 TCP 연결에 걸립니다** — 5080 의 WS 도 포함입니다.
#    WS 는 자체 keepalive(30초)로 계속 활성이라 실질적인 변화는 없지만, 이 파일을
#    지워 TLS 를 끄면 그때 기본값(120초)으로 돌아간다는 점은 알고 있어야 합니다.
tcp_connection_lifetime=3605
