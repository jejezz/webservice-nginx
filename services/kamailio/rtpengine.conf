; rtpengine 데몬 설정.
;
; /etc/rtpengine/rtpengine.conf 로 설치합니다. 이 파일은 그 원본입니다.
;
; ⚠️ <공인IP> 자리를 반드시 채워야 합니다. 그대로 두면 rtpengine 이 사설 주소를
;    SDP 에 광고해 외부 모바일이 미디어를 보낼 곳을 알 수 없게 됩니다
;    (한쪽만 들리거나 무음 — 조용히 실패하는 대표적인 형태입니다).
;
; ── 어디서 오는가 (2026-09-02 확인) ──────────────────────────────────────
;
;   Ubuntu 24.04   rtpengine-daemon 11.5.1.18  — noble/universe 에 있습니다
;   Ubuntu 22.04   저장소에 없습니다. 그 판에서는 rtpproxy 를 씁니다
;
; 이 문서가 한동안 "배포판 저장소에 없다" 고 적고 있었는데 24.04 에서는
; 사실이 아닙니다. 반대로 **rtpproxy 가 24.04 에서 빠졌습니다.** 그래서 이
; 배치의 미디어 릴레이는 배포판에 따라 갈립니다 — kamailio.cfg 의
; WITH_RTPENGINE 분기가 그것을 가릅니다.

[rtpengine]

; --- 인터페이스 ---
;
; 형식은 "사설주소!광고주소" 입니다. 왼쪽 주소로 패킷을 주고받고, SDP 에는
; 오른쪽 주소를 적습니다. 서버가 NAT 내부라 이 구분이 필수입니다.
;
;   왼쪽    이 호스트의 LAN 주소 (실제로 바인딩하는 곳) — settings.ini 의 sip_listen_addr
;   오른쪽  공유기의 외부 주소 (모바일이 보게 될 곳)     — settings.ini 의 media_public_ip
;
; ⚠️ 자리표시자는 아래 interface 줄에만 둡니다. 설명에까지 적으면 치환이
;    끝난 뒤에도 그 글자가 남아, install.sh 의 '치환 안 된 자리' 검사가
;    걸립니다 — 실제로 그렇게 걸렸습니다.
;
; ⚠️ 자리표시자는 install.sh 가 채웁니다. 장비마다 다른 값을 여기에 박아 두면
;    다른 장비에서 조용히 틀립니다 (services/janus 에서 같은 실수를 걷어냈습니다).
;    공인 IP 가 없으면 install.sh 가 왼쪽 주소만 남깁니다 — LAN 전용입니다.
;
; 공인 IP 가 바뀌는 회선이면 DDNS 로 추적해 이 값을 갱신하고 rtpengine 을
; 재시작하는 절차가 필요합니다. 갱신하지 않으면 그때부터 무음이 됩니다.
interface = __MEDIA_ADDR__!__PUBLIC_IP__

; --- 포트 범위 ---
;
; ⚠️ **Janus 의 두 범위와 겹치면 안 됩니다.** 셋 다 같은 장비에서 UDP 포트를
;    바인딩하는 다른 프로세스입니다.
;
;      브라우저 ──WebRTC──▶ Janus ──평문 RTP──▶ rtpengine ──▶ 인터폰
;                   20000-20200  │  30000-30200      10200-19999
;                   janus.jcfg   └ janus.plugin.sip.jcfg   여기
;
; 이 범위는 rtpproxy 가 쓰던 자리를 그대로 물려받은 것입니다. 예전 템플릿의
; 30000-30500 은 Janus 의 SIP 미디어(30000-30200)와 정면으로 부딪혔습니다.
;
; 공유기 포워딩이 필요한 것은 **Janus 의 WebRTC 범위뿐입니다** — 인터넷에서
; 들어오는 것은 브라우저의 WebRTC 다리 하나이고, 이 범위는 LAN 안에서만 쓰입니다.
; 나중에 모바일이 SIP 로 직접 붙게 되면 그때 이 범위도 포워딩 대상이 됩니다.
port-min = 10200
port-max = 19999

; --- Kamailio 와의 제어 채널 ---
;
; Kamailio 의 rtpengine 모듈이 이 주소로 ng 프로토콜 명령을 보냅니다.
; 루프백에만 열어 둡니다.
listen-ng = 127.0.0.1:2223

; --- 동작 ---
;
; 커널 모듈(xt_RTPENGINE)을 쓰면 패킷 포워딩이 커널에서 일어나 CPU 를 크게 아낍니다.
; 커널 모듈 없이도 동작하지만(userspace) 부하가 올라갑니다.
; 트랜스코딩이 걸린 스트림은 어차피 userspace 로 내려갑니다 — 이 배치는 음성·영상
; 모두 트랜스코딩이 없으므로 커널 포워딩의 이득을 그대로 받습니다.
;table = 0

log-level = 6
log-facility = daemon

; 통화가 끊겼는데 미디어만 남는 경우를 정리합니다 (초).
timeout = 60
silent-timeout = 3600
