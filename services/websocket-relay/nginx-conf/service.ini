# websocket-relay 리버스 프록시 선언
# 스키마: ../../../docs/nginx-conf.md
#
# 이 서비스는 TLS 를 직접 다루지 않는다. 예전에는 28099 에 HTTPS 를 열고
# 안드로이드 단말이 포트로 **직접** 붙었지만, 지금은 nginx 가 443 에서 끊고
# 루프백으로 평문을 넘긴다 — 나머지 서비스와 같은 방식이다.
#
# 단말이 보는 인증서는 달라지지 않는다. nginx 가 내미는 것이 이 서비스가 직접
# 읽던 바로 그 파일(nginx/cert/server/server.crt)이다. 달라지는 것은 주소와,
# TLS 를 끊는 곳이 한 군데로 모인다는 점이다.

[service]
name        = websocket-relay
host        = 127.0.0.1
ports       = 28099
protocol    = http
health_path = /health

# 자체 대시보드 경로(/dashboard)는 pm2-conf 의 [env] DASHBOARD_PATH 에 있다.
# manager 가 location 과 합쳐 /relay/dashboard 링크를 만든다.

# ── WebSocket ────────────────────────────────────────
# 릴레이의 본체다. 통화가 이어지는 동안 연결이 계속 열려 있으므로 읽기
# 타임아웃을 하루로 준다 — 기본값 120초면 통화 중에 끊긴다. 포트 직결일
# 때는 nginx 를 안 거쳐서 드러나지 않던 문제다.
#
# 정확히 일치(=)로 두어 아래 /relay/ 접두사보다 먼저 결정되게 한다.
[route:rtc]
order      = 10
location   = = /relay/rtc
websocket  = true
timeout    = 86400

[route:iot]
order      = 10
location   = = /relay/iot
websocket  = true
timeout    = 86400

# ── REST + 대시보드 ──────────────────────────────────
# ⚠️ proxy_path 를 **두지 않는다.** 원본 URI 가 그대로 넘어가야 한다.
#
#    접두사를 여기서 잘라내면 /relay/mobile-crud-operation 이 백엔드에
#    /mobile-crud-operation 으로 도착한다. 그 경로는 앱에만 붙어 있고 내부망
#    IP 검사를 하는데, nginx 를 거친 요청은 소켓 주소가 늘 127.0.0.1 이라
#    검사를 무조건 통과한다. 즉 잘라내는 순간 단말 관리 API 가 외부에
#    열린다. /sip-push 도 같다.
#
#    지금처럼 원본 URI 를 넘기면 그 요청은 BASE_PATH 에 붙은 라우터로 가고,
#    거기에는 두 경로가 없으므로 404 로 끝난다. (src/libs/paths.ts 참고)
#
#    통합 전의 websocket-relay-gateway 선언은 proxy_path 로 접두사를
#    잘라냈는데, 그쪽은 내부 전용 경로가 라우터 안에 있어 사정이 달랐다.
#    지금 코드에는 그 방식을 쓰면 안 된다.
[route:main]
location  = /relay/
timeout   = 30
