# websocket-relay 프로세스 선언
# 스키마: ../../../docs/pm2-conf.md
#
# 평문 HTTP 서버다. TLS 는 nginx 가 443 에서 끊고 루프백으로 넘긴다.
# 포트는 .env(PORT=28099)에서 읽으므로 여기에 두지 않고 헬스 URL 만 지정한다.
# 공개 주소는 nginx-conf/service.ini 의 /relay/ 다.

[app]
name         = websocket-relay
# tsx 로 src 를 직접 돌리는 dev 선언이었으나 실제로 검증된 적이 없었다 — tsx 가
# tsconfig 의 module: nodenext 때문에 진입점을 ESM 으로 실행해 __dirname 을 쓰는
# config.ts/siteSettings.ts/deviceCert.ts/index.ts 가 전부 죽는다. 실제로 안정적으로
# 돌아 온 건 항상 dist(tsc 로 컴파일한 CommonJS) 였으므로 선언을 실물에 맞춘다.
# 배포 시 npm run build 를 먼저 해야 한다.
script       = dist/index.js
watch        = false
# 이관 전에도 메모리 상한이 없었다. 기본값 256M 이 붙지 않게 명시한다.
max_memory_restart = none

[env]
NODE_ENV            = development
HEALTH_URL          = http://127.0.0.1:28099/health
# 서비스 자체 관리 대시보드 경로. manager 가 nginx-conf 의 location 과 합쳐
# /relay/dashboard 링크를 만든다.
DASHBOARD_PATH      = /dashboard

[env:production]
NODE_ENV            = production
HEALTH_URL          = http://127.0.0.1:28099/health
