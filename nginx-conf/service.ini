# rtc-relay-server 리버스 프록시 선언
# 스키마: ../../../docs/nginx-conf.md
#
# 이 서비스는 자체 HTTPS 서버다 (자체 서명 인증서). Android 단말은 포트 28099 로
# 직접 붙고, 사람은 Nginx 를 거쳐 대시보드를 본다. 그래서 protocol = https 로 두어
# Nginx 가 백엔드 TLS 검증을 건너뛰게 한다.
#
# 앱은 라우터를 '/' 와 '/rtc-relay' 양쪽에 붙여 두 경로 모두에 응답한다
# (proxy_pass 에 URI 가 없어 원본 경로가 그대로 전달되기 때문).

[service]
name        = rtc-relay-server
host        = 127.0.0.1
ports       = 28099
protocol    = https
health_path = /health

# 자체 대시보드 경로(/dashboard)는 pm2-conf 의 [env] DASHBOARD_PATH 에 있다.
# manager 가 location 과 합쳐 /rtc-relay/dashboard 링크를 만든다.
[route:main]
location  = /rtc-relay/
websocket = true
