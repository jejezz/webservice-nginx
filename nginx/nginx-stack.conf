# 서버 수준 설정.
#
# 라우트는 여기에 없다 — 각 서비스가 자기 디렉토리의 nginx-conf/*.ini 에
# 포트·프로토콜·라우트를 선언하고, install_nginx_stack.sh 가 그것을 모아
# /etc/nginx/conf.d/path-routing.conf 를 만든다.
#
# 스키마:    ../docs/nginx-conf.md
# 선언 확인: ./install_nginx_stack.sh --check

[general]
; 비워 두면 site/settings.ini 의 host 를 씁니다 (site/README.md).
; 인증서·앱 주소와 같은 이름이어야 하므로 한 곳에서 정하는 편이 안전합니다.
; 여기 적으면 그것이 이깁니다. 둘 다 없으면 localhost 입니다.
server_name =
listen_port = 80
ssl_port    = 443

# nginx-conf/ 를 찾아 훑을 디렉토리. 이 파일 기준 상대 경로.
services_dir = ../services

# client_max_body_size. 비우면 지시자를 만들지 않는다(= nginx 기본값 1m).
# 라우트별로 덮어쓰려면 서비스 쪽 [route:*] 에 max_body 를 준다.
max_body =

# 루트 '/' 접속 시 302 로 보낼 곳. 비우면 리다이렉트하지 않는다.
# 301이 아니라 302인 이유: 301은 브라우저가 강하게 캐시해서 나중에 목적지를
# 바꿔도 따라오지 않는다.
default_route = /manager

# 공유기 포트 포워딩을 쓰는 경우 외부에서 접속하는 포트를 적는다.
# HTTP로 들어온 외부 요청을 HTTPS로 보낼 때 목적지 포트를 알아야 하기 때문이다.
#   외부 28080 -> 내부 80,  외부 28443 -> 내부 443
# 포워딩이 없거나 내부 포트와 같으면 비워둔다.
#
# 2026-08-29: 비웠다. 공유기가 표준 포트(80·443)를 그대로 넘기게 바뀌었고,
# 28080·28443 은 더 이상 응답하지 않는다. 값을 남겨 두면 80 으로 들어온 요청을
# 죽은 28443 으로 보내게 되어 오히려 해롭다. 되돌리려면 두 값을 다시 채운다.
public_http_port  =
public_https_port =

[tls]
# cert_dir 은 이 파일 기준 상대 경로. 나머지는 cert_dir 기준.
# 절대 경로를 주면 cert_dir 을 무시한다 — Let's Encrypt 경로가 그 경우다.
cert_dir  = ./cert

# 서버 인증서. Let's Encrypt 가 발급하고 certbot 이 90일마다 갱신한다.
# 발급·갱신 절차는 public_ca/README.md 를 보라.
#
# fullchain.pem 이다. cert.pem 을 쓰면 중간 인증서가 빠져서, 브라우저는 멀쩡한데
# 일부 안드로이드 기기에서만 실패하는 버그가 난다.
#
# 사설 CA 로 되돌리려면 (개발용):
#   cert_file = server/server.crt
#   key_file  = server/server.key
cert_file = /etc/letsencrypt/live/c-a3f19c04.rtc.zoomon.art/fullchain.pem
key_file  = /etc/letsencrypt/live/c-a3f19c04.rtc.zoomon.art/privkey.pem

# mTLS. 둘 다 채워야 클라이언트 인증서 검증 블록을 만든다.
client_ca     = ca/ca.crt
verify_client = optional

# Let's Encrypt HTTP-01 챌린지를 놓을 자리.
#
# 80 포트는 전부 HTTPS 로 301 하는데, 챌린지 경로만은 평문으로 응답해야 한다.
# Let's Encrypt 는 반드시 80 으로 들어오고 포트를 지정할 수 없기 때문이다.
# 비우면 이 예외를 만들지 않는다(= HTTP-01 을 쓰지 않는 배치).
#
# 이 디렉토리는 nginx 가 읽을 수 있어야 한다:
#   sudo mkdir -p /var/www/certbot && sudo chown root:www-data /var/www/certbot
acme_webroot = /var/www/certbot
