; MariaDB 설정. setup_mariadb.sh가 이 파일을 읽어 서버 설정과 DB/사용자를 적용합니다.
;
;   - [server]의 항목은 그대로 mysqld 옵션으로 들어갑니다. 여기 없는 옵션도 자유롭게 추가할 수 있습니다.
;   - 이 파일에 없는 데이터베이스나 사용자를 삭제하지는 않습니다. (추가/갱신만)
;   - 비밀번호는 이 파일에 쓰지 않습니다. secrets/ 파일이나 환경 변수를 사용하세요.
;
; 적용:  sudo ./setup_mariadb.sh

[server]
; 127.0.0.1 = 로컬 전용. 외부 접속을 허용하려면 0.0.0.0 (방화벽 설정 필수)
bind_address = 0.0.0.0
port = 3306

character_set_server = utf8mb4
collation_server = utf8mb4_unicode_ci

max_connections = 151
max_allowed_packet = 64M

; InnoDB — 전용 서버라면 buffer pool을 물리 메모리의 50~70%까지 올립니다.
innodb_buffer_pool_size = 256M
innodb_log_file_size = 64M
innodb_flush_log_at_trx_commit = 1
innodb_file_per_table = 1

; 느린 쿼리 로그
slow_query_log = 1
slow_query_log_file = /var/log/mysql/slow.log
long_query_time = 2

log_error = /var/log/mysql/error.log
expire_logs_days = 10

[security]
; 익명 사용자 제거
remove_anonymous_users = true
; 기본 생성되는 test 데이터베이스 제거
remove_test_database = true
; 원격지에서의 root 로그인 차단 (localhost만 허용)
disallow_remote_root = true

; --- 데이터베이스 ---
; [database:이름] 형식. charset/collation은 생략하면 [server] 값을 씁니다.
;
; 스키마 SQL은 각 서비스 디렉토리가 소유합니다. schema_dir 안의 *.sql 을 이름순으로 실행하므로
; 확장할 때는 그 디렉토리에 002-xxx.sql 을 추가하고 다시 적용하면 됩니다.
; 모든 파일은 여러 번 실행해도 안전하게 작성해야 합니다. (CREATE TABLE IF NOT EXISTS 등)
;
; DB 이름에는 하이픈을 쓸 수 없어 서비스 ws-bridge 의 스키마는 ws_bridge 입니다.

[database:manager]
schema_dir = ../services/manager/schema

[database:ws_bridge]
schema_dir = ../services/ws-bridge/schema

; StockAnalyzer — 사용자별 즐겨찾기/최근 조회.
; DB 이름에는 하이픈을 쓸 수 없어 서비스 stock-analyzer 의 스키마는 stock_analyzer 다.
; 한글 종목명이 들어가므로 [server]의 utf8mb4 기본값을 그대로 쓴다.
[database:stock_analyzer]
schema_dir = ../services/stock-analyzer/schema

; RTC 릴레이/시그널링 서버 — 등록된 모바일 단말과 홈넷 장치.
; DB 이름에는 하이픈을 쓸 수 없어 서비스 websocket-relay 의 스키마는 rtc_relay 다.
; 단말이 보내는 이메일·주소에 한글이 들어가므로 [server]의 utf8mb4 기본값을 그대로 쓴다.
[database:rtc_relay]
schema_dir = ../services/websocket-relay/schema

; Kamailio SIP 서버의 계정(subscriber) 테이블.
; Kamailio 배포판은 kamdbctl 로 스키마를 만들지만, 그러면 이 파일의 관리 밖에 놓이므로
; 필요한 테이블만 멱등하게 옮겨 두고 여기서 함께 관리한다.
; 설치·설정은 services/kamailio/ 참고. (ws-bridge 아래에 있던 것을 자기 서비스
; 디렉토리로 올렸다 — Kamailio 는 ws-bridge 의 부속이 아니라 독립 서비스다)
[database:kamailio]
schema_dir = ../services/kamailio/schema

; --- 사용자 ---
; [user:이름] 형식.
;
;   host          접속 허용 호스트 (localhost, %, 192.168.0.%)
;   databases     권한을 줄 DB 목록 (쉼표 구분, * 는 전체)
;   privileges    ALL 또는 SELECT,INSERT,UPDATE,DELETE 처럼 나열
;   password_env  비밀번호를 담은 환경 변수 이름
;   password_file 비밀번호가 든 파일 경로
;
; 둘 다 없으면 secrets/<사용자>.pw 에 새로 만들어 저장합니다. (권한 600)

; 모든 서비스 스키마를 다루는 공용 계정.
; host = % 이므로 외부(LAN 및 라우터를 통과하는 모든 곳)에서 접속할 수 있습니다.
; 비밀번호는 secrets/jyahn.pw 에 있습니다.
[user:jyahn]
host = %
databases = manager, ws_bridge, kamailio, stock_analyzer, rtc_relay
privileges = ALL

; Kamailio 데몬 전용 계정.
; 데몬은 localhost 로만 붙으므로 host 를 좁혀 둔다. (jyahn 과 달리 외부에서 쓸 일이 없다)
; 비밀번호는 password_file / password_env 를 주지 않았으므로 secrets/kamailio.pw 에
; 새로 만들어 저장한다. services/kamailio/install.sh 가 그 파일을 읽어
; /etc/kamailio/ 설정에 채워 넣는다.
[user:kamailio]
host = localhost
databases = kamailio
privileges = ALL
