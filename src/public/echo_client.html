<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test Client</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        textarea {
            resize: vertical;
            min-height: 200px;
        }
        button {
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            transform: translateY(-1px);
        }
        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-3xl font-bold text-gray-800 text-center">WebSocket Echo Client</h1>
        <textarea
            id="output"
            class="w-full p-4 border border-gray-300 rounded-lg bg-gray-50 text-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            readonly
            placeholder="WebSocket messages will appear here..."
        ></textarea>
        <div class="flex flex-col sm:flex-row gap-3">
            <input
                type="text"
                id="messageInput"
                class="flex-grow p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800"
                placeholder="Type your message here..."
            >
            <button
                id="sendButton"
                class="px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-75"
            >
                Send Message
            </button>
        </div>
        <p class="text-sm text-gray-600 text-center mt-2">
            Server running on port <span id="portDisplay">8080</span>. Your user ID: <span id="userIdDisplay">Connecting...</span>
        </p>
    </div>

    <script>
        const output = document.getElementById('output');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const portDisplay = document.getElementById('portDisplay');
        const userIdDisplay = document.getElementById('userIdDisplay');
        let ws;
        let currentUserId = 'anonymous-' + Math.random().toString(36).substring(2, 11); // Simple random ID for demonstration

        function log(message) {
            output.value += message + '\n';
            output.scrollTop = output.scrollHeight; // Auto-scroll to bottom
        }

        // The WebSocket URL will be the same as the HTTP server's origin
        const wsUrl = `wss://${window.location.host}/iot`;

        function connectWebSocket() {
            log('Attempting to connect to ' + wsUrl + '...');
            ws = new WebSocket(wsUrl);

            ws.onopen = (event) => {
                log('WebSocket Connected!');
                userIdDisplay.textContent = currentUserId; // Display the user ID on connection
            };

            ws.onmessage = (event) => {
                log('Received: ' + event.data);
            };

            ws.onclose = (event) => {
                log('WebSocket Disconnected. Code: ' + event.code + ', Reason: ' + event.reason);
                if (event.wasClean) {
                    log('Connection closed cleanly.');
                } else {
                    log('Connection died unexpectedly.');
                }
                userIdDisplay.textContent = 'Disconnected';
            };

            ws.onerror = (error) => {
                log('WebSocket Error: ' + error.message);
                userIdDisplay.textContent = 'Error';
            };
        }

        sendButton.addEventListener('click', () => {
            const message = messageInput.value.trim();
            if (message === '') return; // Don't send empty messages

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(message);
                log('Sent: ' + message);
                messageInput.value = ''; // Clear input
            } else {
                log('WebSocket is not open. Cannot send message.');
            }
        });

        // Connect when the page loads
        window.onload = () => {
            portDisplay.textContent = window.location.port || '80'; // Display the port
            connectWebSocket();
        };
    </script>
</body>
</html>
