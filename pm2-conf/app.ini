# callfusion2rtc 프로세스 선언
# 스키마: ../../../docs/pm2-conf.md
#
# 자체 HTTPS 서버다. 포트는 이 프로젝트의 .env(HTTPS_PORT=28099)에서 읽으므로
# 여기에 PORT 를 두지 않고, 헬스 URL 을 직접 지정한다.
# Nginx 라우트가 없다 — 포트로 직접 접근하는 서비스다.

[app]
name         = callfusion2rtc
script       = src/index.ts
interpreter  = node_modules/.bin/tsx
watch        = src
# 이관 전에도 메모리 상한이 없었다. 기본값 256M 이 붙지 않게 명시한다.
max_memory_restart = none
ignore_watch = node_modules logs

[env]
NODE_ENV            = development
HEALTH_URL          = https://127.0.0.1:28099/health
# 자체 서명 인증서라 검증을 건너뛴다.
HEALTH_INSECURE_TLS = true

[env:production]
NODE_ENV            = production
HEALTH_URL          = https://127.0.0.1:28099/health
HEALTH_INSECURE_TLS = true
